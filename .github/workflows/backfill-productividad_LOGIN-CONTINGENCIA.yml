name: Backfill Productividad y Lineas Picking

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha desde (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"
      hasta:
        description: "Fecha hasta (YYYY-MM-DD)"
        required: true
        default: "2026-09-09"

permissions:
  contents: write

# Grupo independiente del autosync normal.
concurrency:
  group: backfill-productividad
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar historico de Copernico
        env:
          COPERNICO_EMAIL: ${{ secrets.COPERNICO_EMAIL }}
          COPERNICO_PASSWORD: ${{ secrets.COPERNICO_PASSWORD }}
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          import urllib.parse
          import http.cookiejar
          import time
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          LOGIN_URL = "https://services.copernicowms.com/users/api/login"
          LOGOUT_URL = "https://services.copernicowms.com/users/api/logout"
          PRODUCTIVITY_URL = "https://services.copernicowms.com/backweb25/kpi/productividad/empleados"
          PICKING_LINES_URL = "https://services.copernicowms.com/backweb25/pasillos/lineas/picking"

          EMAIL = os.environ["COPERNICO_EMAIL"]
          PASSWORD = os.environ["COPERNICO_PASSWORD"]
          DESDE = os.environ["DESDE"].strip()
          HASTA = os.environ["HASTA"].strip()

          PRODUCTIVITY_DIR = Path("datos/productividad")
          PICKING_DIR = Path("datos/lineas-picking")
          SUMMARY_DIR = Path("datos/productividad-resumen")
          PRODUCTIVITY_DIR.mkdir(parents=True, exist_ok=True)
          PICKING_DIR.mkdir(parents=True, exist_ok=True)
          SUMMARY_DIR.mkdir(parents=True, exist_ok=True)

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          BASE_HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://copernicowms.com",
              "Referer": "https://copernicowms.com/",
              "User-Agent": "Mozilla/5.0",
          }

          class ApiError(RuntimeError):
              def __init__(self, code, detail, url):
                  super().__init__(f"HTTP {code}: {detail}")
                  self.code = code
                  self.detail = detail
                  self.url = url

          DEFAULT_TECH_USER_ID = 11257

          def request_json(url, method="GET", data=None, jwt=None, timeout=180):
              headers = dict(BASE_HEADERS)
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode("utf-8")
              else:
                  body = None
              if jwt:
                  headers["Authorization"] = jwt
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with opener.open(req, timeout=timeout) as resp:
                      raw = resp.read()
                      status = resp.status
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode("utf-8", errors="replace")[:700]
                  except Exception:
                      detail = ""
                  raise ApiError(e.code, detail, url)
              try:
                  parsed = json.loads(raw.decode("utf-8"))
              except Exception:
                  raise RuntimeError(f"{method} {url} respondió HTTP {status}, pero no devolvió JSON")
              return parsed, status

          def force_logout_by_id(user_id):
              if user_id is None:
                  return False
              headers = dict(BASE_HEADERS)
              headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  LOGOUT_URL,
                  data=json.dumps({"id": int(user_id)}).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with opener.open(req, timeout=15) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      print("LOGOUT CONTINGENCIA HTTP:", response.status, raw[:180])
                      return 200 <= response.status < 300
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode("utf-8", errors="replace")[:180]
                  except Exception:
                      detail = ""
                  print("LOGOUT CONTINGENCIA FALLÓ:", e.code, detail)
                  return False
              except Exception as e:
                  print("LOGOUT CONTINGENCIA FALLÓ:", str(e)[:180])
                  return False

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []
              for key in ("rows", "data", "items", "result", "results"):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return value
                  if isinstance(value, dict):
                      for subkey in ("rows", "data", "items", "results"):
                          subvalue = value.get(subkey)
                          if isinstance(subvalue, list):
                              return subvalue
              return []

          def norm_key(v):
              return str(v or "").strip().lower().replace(" ", "").replace("_", "").replace("-", "")

          def field(row, *names):
              if not isinstance(row, dict):
                  return ""
              idx = {norm_key(k): v for k, v in row.items()}
              for name in names:
                  k = norm_key(name)
                  if k in idx and idx[k] is not None:
                      return idx[k]
              return ""

          def sval(row, *names):
              return str(field(row, *names) or "").strip()

          def nkey(v):
              return str(v or "").strip().upper()

          def save_json(path, payload):
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )

          def user_id_from_any(obj):
              preferred = {"id", "userid", "user_id", "idusuario", "id_usuario", "usuarioid", "usuario_id"}
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      nk = str(k).lower().replace("-", "_")
                      if nk in preferred:
                          if isinstance(v, int):
                              return v
                          if isinstance(v, str) and v.isdigit():
                              return int(v)
                  for v in obj.values():
                      found = user_id_from_any(v)
                      if found is not None:
                          return found
              elif isinstance(obj, list):
                  for v in obj:
                      found = user_id_from_any(v)
                      if found is not None:
                          return found
              return None

          def user_id_from_jwt(token):
              try:
                  part = token.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(part).decode("utf-8"))
                  return user_id_from_any(claims)
              except Exception:
                  return None

          def parse_dt(value):
              text = str(value or "").strip()
              if not text:
                  return None
              for fmt in (
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
              ):
                  try:
                      return datetime.strptime(text, fmt)
                  except Exception:
                      pass
              try:
                  return datetime.fromisoformat(text.replace("Z", "+00:00")).replace(tzinfo=None)
              except Exception:
                  return None

          def prod_hour(row):
              # Misma lógica que el workflow operativo que ya genera tiempos.json correctamente.
              # En Productividad, FechaRegistro puede venir con hora 00:00:00 y NO debe
              # usarse para calcular la franja horaria. La hora real está en Hora / HoraRegistro.
              raw = field(row, "hora", "Hora")
              try:
                  return int(float(raw))
              except Exception:
                  pass
              hr = sval(row, "horaregistro", "HoraRegistro", "horaRegistro")
              try:
                  return int(hr[0:2])
              except Exception:
                  return -1

          def prod_process(row):
              return sval(row, "Proceso", "proceso", "TipoProceso", "tipoProceso")

          def sku_values(row, source):
              if source == "prod":
                  vals = [
                      sval(row, "ean", "EAN"),
                      sval(row, "ref", "Ref", "Referencia"),
                      sval(row, "barcode", "Barcode"),
                  ]
              else:
                  vals = [
                      sval(row, "ean", "EAN"),
                      sval(row, "product", "Product", "producto", "Producto"),
                  ]
              return [nkey(x) for x in vals if nkey(x)]

          def build_summary(prod_rows, pick_rows, day_key, day_label, updated_at):
              # La zona se obtiene de Líneas de Picking. Productividad NO decide la zona.
              by_exact = defaultdict(list)
              by_pick_sku = defaultdict(list)

              for ln in pick_rows:
                  picking = nkey(sval(ln, "NumPicking", "Picking", "picking"))
                  pedido = nkey(sval(ln, "pedido", "Pedido", "NumPedido"))
                  if not picking:
                      continue
                  for sku in sku_values(ln, "pick"):
                      by_pick_sku[(picking, sku)].append(ln)
                      if pedido:
                          by_exact[(picking, pedido, sku)].append(ln)

              def choose_line(pr):
                  picking = nkey(sval(pr, "Picking", "picking", "NumPicking"))
                  pedido = nkey(sval(pr, "NumPedido", "Pedido", "pedido"))
                  skus = sku_values(pr, "prod")
                  for sku in skus:
                      rows = by_exact.get((picking, pedido, sku), [])
                      if len(rows) == 1:
                          return rows[0], "Picking+Pedido+SKU"
                      if len(rows) > 1:
                          # Todas pertenecen al mismo artículo; primera fila solo para leer zona.
                          zones = {nkey(sval(x, "zonapiso", "ZonaPiso", "zona", "Zona")) for x in rows}
                          zones.discard("")
                          if len(zones) == 1:
                              return rows[0], "Picking+Pedido+SKU (misma zona)"
                  for sku in skus:
                      rows = by_pick_sku.get((picking, sku), [])
                      zones = {nkey(sval(x, "zonapiso", "ZonaPiso", "zona", "Zona")) for x in rows}
                      zones.discard("")
                      if len(rows) == 1 or len(zones) == 1:
                          return rows[0], "Picking+SKU"
                  return None, "Sin cruce seguro"

              detail = []
              grouped = {}

              for pr in prod_rows:
                  proc = nkey(prod_process(pr))
                  if proc and "PICK" not in proc:
                      continue
                  hh = prod_hour(pr)
                  if hh < 6 or hh >= 14:
                      continue

                  picker = sval(pr, "Nombres", "nombres", "NombreEmpleado", "nombreEmpleado")
                  emp = sval(pr, "Empleado", "empleado", "IdEmpleado", "idEmpleado")
                  if not picker:
                      picker = emp or "Sin nombre"

                  ln, match = choose_line(pr)
                  zone = nkey(sval(ln, "zonapiso", "ZonaPiso", "zona", "Zona")) if ln else ""

                  row = {
                      "Fecha": day_label,
                      "Picker": picker,
                      "IdEmpleado": emp,
                      "Picking": sval(pr, "Picking", "picking", "NumPicking"),
                      "Pedido": sval(pr, "NumPedido", "Pedido", "pedido"),
                      "SKU": sval(pr, "ean", "EAN", "ref", "Ref", "barcode", "Barcode"),
                      "FechaRegistro": sval(pr, "fecharegistro", "FechaRegistro", "fechaRegistro"),
                      "Hora": hh,
                      "ZonaLineaPicking": zone,
                      "CruceZona": match,
                  }
                  detail.append(row)

                  gkey = (emp, picker)
                  if gkey not in grouped:
                      grouped[gkey] = {
                          "Fecha": day_label,
                          "FechaQuery": day_key,
                          "IdEmpleado": emp,
                          "Picker": picker,
                          "Lineas": 0,
                          "Zonas": Counter(),
                          "SinCruceZona": 0,
                      }
                  g = grouped[gkey]
                  g["Lineas"] += 1
                  if zone:
                      g["Zonas"][zone] += 1
                  else:
                      g["SinCruceZona"] += 1

              pickers = []
              for g in grouped.values():
                  zonas = dict(g["Zonas"].most_common())
                  principal = next(iter(zonas), "")
                  pickers.append({
                      "Fecha": g["Fecha"],
                      "FechaQuery": g["FechaQuery"],
                      "IdEmpleado": g["IdEmpleado"],
                      "Picker": g["Picker"],
                      "Lineas": g["Lineas"],
                      "PromedioLineasHora": round(g["Lineas"] / 6.5, 2),
                      "ZonaPrincipal": principal,
                      "Zonas": zonas,
                      "SinCruceZona": g["SinCruceZona"],
                  })

              pickers.sort(key=lambda x: (-x["Lineas"], x["Picker"].upper()))
              return {
                  "updated_at": updated_at,
                  "fecha": day_label,
                  "fecha_query": day_key,
                  "source": "Cruce ProductividadPIK + Líneas de Picking; zona exclusivamente desde Líneas de Picking",
                  "referencia_minutos": 390,
                  "productividad_raw_count": len(prod_rows),
                  "lineas_picking_raw_count": len(pick_rows),
                  "lineas_productividad_06_14": len(detail),
                  "pickers_count": len(pickers),
                  "pickers": pickers,
                  "rows": detail,
              }

          start = datetime.strptime(DESDE, "%Y-%m-%d")
          end = datetime.strptime(HASTA, "%Y-%m-%d")
          if end < start:
              raise SystemExit("HASTA no puede ser anterior a DESDE")
          if (end - start).days > 62:
              raise SystemExit("Por seguridad, un backfill puede abarcar como máximo 63 días por ejecución")

          print("=== LOGIN COPERNICO ===")
          try:
              login, _ = request_json(
                  LOGIN_URL,
                  method="POST",
                  data={"email": EMAIL, "password": PASSWORD, "plataforma": "Copernico WMS"},
                  timeout=30,
              )
          except ApiError as e:
              if e.code in (403, 418):
                  print(f"LOGIN HTTP {e.code}. Detalle: {(e.detail or '')[:250]}")
                  print(f"Intentando liberar sesión técnica ID {DEFAULT_TECH_USER_ID} y reintentar...")
                  force_logout_by_id(DEFAULT_TECH_USER_ID)
                  time.sleep(2)
                  login, _ = request_json(
                      LOGIN_URL,
                      method="POST",
                      data={"email": EMAIL, "password": PASSWORD, "plataforma": "Copernico WMS"},
                      timeout=30,
                  )
                  print("LOGIN RECUPERADO OK")
              else:
                  raise

          jwt = login.get("jwt") if isinstance(login, dict) else None
          if not jwt:
              raise SystemExit("Copérnico no devolvió JWT")
          user_id = user_id_from_any(login) or user_id_from_jwt(jwt) or DEFAULT_TECH_USER_ID
          print("LOGIN OK")

          successes = 0
          failures = []
          dt = start
          try:
              while dt <= end:
                  day = dt.strftime("%Y%m%d")
                  label = dt.strftime("%d/%m/%Y")
                  updated_at = datetime.now(timezone.utc).isoformat()
                  print(f"\n=== {day} ===")
                  try:
                      prod_url = PRODUCTIVITY_URL + "?" + urllib.parse.urlencode({
                          "fecha": day,
                          "tipo_productividad": "ProductividadPIK",
                      })
                      pick_url = PICKING_LINES_URL + "?" + urllib.parse.urlencode({"fecha": day})

                      prod_response, prod_http = request_json(prod_url, jwt=jwt, timeout=180)
                      pick_response, pick_http = request_json(pick_url, jwt=jwt, timeout=180)
                      prod_rows = extract_rows(prod_response)
                      pick_rows = extract_rows(pick_response)

                      prod_payload = {
                          "updated_at": updated_at,
                          "fecha": label,
                          "fecha_query": day,
                          "source": "Copernico ProductividadPIK RAW",
                          "http": prod_http,
                          "row_count": len(prod_rows),
                          "rows": prod_rows,
                      }
                      pick_payload = {
                          "updated_at": updated_at,
                          "fecha": label,
                          "fecha_query": day,
                          "source": "Copernico Líneas de Picking RAW",
                          "http": pick_http,
                          "row_count": len(pick_rows),
                          "rows": pick_rows,
                      }
                      summary_payload = build_summary(prod_rows, pick_rows, day, label, updated_at)

                      save_json(PRODUCTIVITY_DIR / f"{day}.json", prod_payload)
                      save_json(PICKING_DIR / f"{day}.json", pick_payload)
                      save_json(SUMMARY_DIR / f"{day}.json", summary_payload)

                      print(
                          "OK",
                          day,
                          "· productividad:", len(prod_rows),
                          "· lineas picking:", len(pick_rows),
                          "· resumen 06-14:", summary_payload["lineas_productividad_06_14"],
                          "· pickers:", summary_payload["pickers_count"],
                      )
                      successes += 1
                  except Exception as exc:
                      failures.append((day, str(exc)[:500]))
                      print("ERROR", day, str(exc)[:500])
                  dt += timedelta(days=1)
                  time.sleep(1)
          finally:
              if user_id is not None:
                  try:
                      request_json(LOGOUT_URL, method="POST", data={"id": user_id}, jwt=jwt, timeout=30)
                      print("LOGOUT OK")
                  except Exception as exc:
                      print("AVISO LOGOUT:", str(exc)[:300])

          print(f"\nBACKFILL FINALIZADO · días OK: {successes} · errores: {len(failures)}")
          if failures:
              for day, err in failures:
                  print("FALLO", day, err)
          if successes == 0:
              raise SystemExit("No se pudo descargar ningún día")
          PY

      - name: Publicar historicos
        run: |
          git config user.name "UBICACIONES Backfill"
          git config user.email "actions@github.com"

          git add datos/productividad datos/lineas-picking datos/productividad-resumen

          if git diff --cached --quiet; then
            echo "No hay cambios históricos para publicar."
            exit 0
          fi

          git commit -m "Backfill Productividad y Líneas Picking ${{ github.event.inputs.desde }} a ${{ github.event.inputs.hasta }}"

          # Por si main cambió mientras corría el backfill.
          git pull --rebase origin main
          git push origin HEAD:main
