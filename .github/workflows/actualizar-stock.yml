name: Actualizar datos Copernico

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-copernico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar Copernico con contingencia
        env:
          COPERNICO_EMAIL: ${{ secrets.COPERNICO_EMAIL }}
          COPERNICO_PASSWORD: ${{ secrets.COPERNICO_PASSWORD }}
        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          import urllib.parse
          import http.cookiejar
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          LOGIN_URL = "https://services.copernicowms.com/users/api/login"
          STOCK_URL = "https://services.copernicowms.com/backweb25/inventario/obtenerrefsxcaja?bodega=47"
          PLANRECIBO_URL = "https://services.copernicowms.com/backweb25/planrecibo"
          CAJA_API_BASE = "https://services.copernicowms.com/backweb25/caja/"
          LOGOUT_URL = "https://services.copernicowms.com/users/api/logout"

          EMAIL = os.environ["COPERNICO_EMAIL"]
          PASSWORD = os.environ["COPERNICO_PASSWORD"]

          STATUS_FILE = Path("sync-status.json")
          STOCK_FILE = Path("stock.json")
          PALLETS_FILE = Path("pallets-proceso.json")
          RECEIPT_FILE = Path("en-recibo.json")
          TRACE_FILE = Path("trazabilidad-cajas.json")
          GHOST_FILE = Path("cajas-fantasma-movimientos.json")

          # 119 cajas únicas relevadas como etiquetas viejas/fantasma (columna ETIQUETA).
          GHOST_BOXES = ["362145", "392720", "351304", "320622", "330092", "501197", "331314", "351866", "331553", "312595", "481440", "502542", "502468", "481135", "1160720", "481291", "373159", "371880", "361840", "500702", "372193", "372037", "410928", "960443", "301085", "420679", "330910", "851469", "470260", "590174", "590257", "502914", "502997", "600031", "600114", "362574", "362657", "352732", "352815", "620815", "630111", "390591", "410365", "312348", "312363", "81547", "341461", "341453", "380840", "380923", "302273", "302356", "500934", "500850", "301820", "470443", "470229", "420794", "420117", "480715", "480525", "502559", "502476", "501791", "501874", "502690", "451153", "320606", "330126", "421324", "330936", "301713", "301630", "70011", "312264", "312280", "490276", "400135", "471441", "171017", "312892", "91538", "351536", "351478", "381913", "381830", "310433", "310359", "331009", "342030", "341958", "350959", "350876", "502286", "502369", "322735", "322818", "312736", "312819", "360313", "360230", "300939", "300855", "450197", "450205", "300301", "300228", "480780", "480772", "300335", "500173", "500256", "321281", "321208", "331454", "331538", "502617", "501486", "501569"]
          DEFAULT_TECH_USER_ID = 11257

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar)
          )

          BASE_HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://copernicowms.com",
              "Referer": "https://copernicowms.com/",
              "User-Agent": "Mozilla/5.0"
          }

          class ApiError(RuntimeError):
              def __init__(self, code, detail, url):
                  super().__init__(f"HTTP {code}: {detail}")
                  self.code = code
                  self.detail = detail
                  self.url = url

          def now_utc():
              return datetime.now(timezone.utc)

          def iso(dt):
              return dt.astimezone(timezone.utc).isoformat()

          def load_json_file(path, default):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json_file(path, payload):
              path.write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

          def request_json(url, method="GET", data=None, jwt=None, timeout=120):
              headers = dict(BASE_HEADERS)

              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode("utf-8")
              else:
                  body = None

              if jwt:
                  headers["Authorization"] = jwt

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with opener.open(req, timeout=timeout) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )[:700]
                  except Exception:
                      detail = ""
                  raise ApiError(e.code, detail, url)

              try:
                  parsed = json.loads(raw.decode("utf-8"))
              except Exception:
                  raise RuntimeError(
                      f"{method} {url} respondió HTTP {status}, "
                      "pero no devolvió JSON"
                  )

              return parsed, status, len(raw)

          def force_logout_by_id(user_id):
              """
              Intento de contingencia para liberar una sesión técnica anterior.
              Copérnico recibe el mismo POST /logout que usa el frontend, con
              {"id": user_id}. Es best-effort: si el 418 corresponde a que
              otra persona ocupa la última licencia, este intento no la libera.
              """
              if user_id is None:
                  return False

              headers = dict(BASE_HEADERS)
              headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  LOGOUT_URL,
                  data=json.dumps({"id": int(user_id)}).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with opener.open(req, timeout=15) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      print(
                          "LOGOUT CONTINGENCIA HTTP:",
                          response.status,
                          raw[:180]
                      )
                      return 200 <= response.status < 300
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode("utf-8", errors="replace")[:180]
                  except Exception:
                      detail = ""
                  print("LOGOUT CONTINGENCIA FALLÓ:", e.code, detail)
                  return False
              except Exception as e:
                  print("LOGOUT CONTINGENCIA FALLÓ:", str(e)[:180])
                  return False

          def recursive_user_id(obj):
              preferred = {
                  "id",
                  "userid",
                  "user_id",
                  "idusuario",
                  "id_usuario",
                  "usuarioid",
                  "usuario_id"
              }

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      normalized = str(key).lower().replace("-", "_")
                      if normalized in preferred:
                          if isinstance(value, int):
                              return value
                          if isinstance(value, str) and value.isdigit():
                              return int(value)

                  for value in obj.values():
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              elif isinstance(obj, list):
                  for value in obj:
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              return None

          def user_id_from_jwt(token):
              try:
                  parts = token.split(".")
                  if len(parts) < 2:
                      return None

                  payload = parts[1]
                  payload += "=" * (-len(payload) % 4)

                  decoded = base64.urlsafe_b64decode(payload)
                  claims = json.loads(decoded.decode("utf-8"))

                  found = recursive_user_id(claims)
                  if found is not None:
                      return found

                  sub = claims.get("sub")
                  if isinstance(sub, int):
                      return sub
                  if isinstance(sub, str) and sub.isdigit():
                      return int(sub)

              except Exception:
                  pass

              return None

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "rows", "data", "items", "result",
                  "results", "stock", "inventario"
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for subkey in (
                          "rows", "data", "items",
                          "results", "stock"
                      ):
                          subvalue = value.get(subkey)
                          if isinstance(subvalue, list):
                              return subvalue

              return []

          def norm_key(value):
              return (
                  str(value)
                  .strip()
                  .lower()
                  .replace(" ", "")
                  .replace("_", "")
                  .replace("-", "")
              )

          def field(row, *names):
              if not isinstance(row, dict):
                  return ""

              indexed = {
                  norm_key(k): v
                  for k, v in row.items()
              }

              for name in names:
                  key = norm_key(name)
                  if key in indexed:
                      value = indexed[key]
                      if value is not None:
                          return value

              return ""

          def norm_value(value):
              return str(value or "").strip().upper()

          def parse_date(value):
              if value is None or value == "":
                  return float("-inf")

              if isinstance(value, (int, float)):
                  return float(value)

              text = str(value).strip()

              formats = (
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M"
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(text, fmt).timestamp()
                  except Exception:
                      pass

              try:
                  return datetime.fromisoformat(
                      text.replace("Z", "+00:00")
                  ).timestamp()
              except Exception:
                  return float("-inf")

          def caja_api(endpoint, caja, jwt, timeout=35):
              q = urllib.parse.quote(str(caja).strip(), safe="")
              url = CAJA_API_BASE + endpoint + "?caja=" + q
              payload, _, _ = request_json(
                  url,
                  method="GET",
                  jwt=jwt,
                  timeout=timeout
              )
              return payload

          def compact_trace_for_skus(caja, movimientos, current_skus):
              """
              Reduce el historial completo de la caja a UN solo movimiento por
              SKU actual: el movimiento que inició la racha de saldo positivo
              que sigue vigente. Es exactamente la evidencia que consume el
              dashboard para decidir qué SKU llegó último y quién lo ingresó.
              """
              wanted = {str(x).strip() for x in current_skus if str(x).strip()}
              if not wanted:
                  return []

              def pick(m, *names):
                  return field(m, *names)

              def movement_sku(m):
                  return str(pick(m, "EAN", "ean")).strip()

              def number(v):
                  try:
                      return float(str(v).replace(",", "."))
                  except Exception:
                      return None

              compact = []

              for sku in sorted(wanted):
                  sku_rows = [
                      m for m in extract_rows(movimientos)
                      if movement_sku(m) == sku
                  ]

                  sku_rows.sort(
                      key=lambda m: parse_date(
                          pick(
                              m,
                              "Fecha", "fecha",
                              "FechaHora", "Fecha Hora",
                              "FechaMovimiento", "Fecha Mov"
                          )
                      )
                  )

                  if not sku_rows:
                      continue

                  with_saldo = [
                      (m, number(pick(m, "Saldo", "saldo")))
                      for m in sku_rows
                  ]
                  with_saldo = [(m, saldo) for m, saldo in with_saldo if saldo is not None]

                  start = None

                  if with_saldo:
                      # Mismo criterio del dashboard: si el último saldo quedó en
                      # cero, esa caja/SKU ya no sostiene stock actual.
                      if with_saldo[-1][1] <= 0:
                          continue

                      last_zero = -1
                      for i in range(len(with_saldo) - 2, -1, -1):
                          if with_saldo[i][1] <= 0:
                              last_zero = i
                              break

                      start = with_saldo[last_zero + 1][0]

                  if start is None:
                      positives = []
                      for m in sku_rows:
                          mov = number(pick(m, "Movimiento", "movimiento"))
                          estado = str(pick(m, "Estado", "estado")).strip().upper()
                          if (mov is not None and mov > 0) or estado == "ENTRADA":
                              positives.append(m)
                      start = positives[-1] if positives else sku_rows[0]

                  # Solo publicar los campos que usa el front. Esto reduce el JSON
                  # de >100 MB a unos pocos KB/MB aun con muchas posiciones mezcladas.
                  compact.append({
                      "Fecha": pick(
                          start,
                          "Fecha", "fecha",
                          "FechaHora", "Fecha Hora",
                          "FechaMovimiento", "Fecha Mov"
                      ),
                      "EAN": pick(start, "EAN", "ean"),
                      "Estado": pick(start, "Estado", "estado"),
                      "Movimiento": pick(start, "Movimiento", "movimiento"),
                      "Saldo": pick(start, "Saldo", "saldo"),
                      "Transaccion": pick(
                          start,
                          "Transaccion", "Transacción", "transaccion"
                      ),
                      "Nombre_empleado": pick(
                          start,
                          "Nombre_empleado", "Nombre empleado", "NombreEmpleado"
                      ),
                      "Id_empleado": pick(
                          start,
                          "Id_empleado", "ID empleado", "IdEmpleado"
                      ),
                      "NoControl": pick(
                          start,
                          "NoControl", "No Control", "nocontrol"
                      )
                  })

              return compact

          def query_trace_compact(caja, jwt, current_skus):
              try:
                  movimientos = caja_api(
                      "getmovimientos",
                      caja,
                      jwt,
                      timeout=30
                  )

                  compact = compact_trace_for_skus(
                      caja,
                      movimientos,
                      current_skus
                  )

                  return {
                      "ok": True,
                      "caja": str(caja).strip(),
                      "movimientos": compact,
                      "ubicaciones": [],
                      "inventario": [],
                      "compact": True
                  }
              except Exception as e:
                  return {
                      "ok": False,
                      "caja": str(caja).strip(),
                      "error": str(e)[:300],
                      "movimientos": [],
                      "ubicaciones": [],
                      "inventario": [],
                      "compact": True
                  }

          def compact_movement_event(m):
              return {
                  "Fecha": field(
                      m,
                      "Fecha", "fecha",
                      "FechaHora", "Fecha Hora",
                      "FechaMovimiento", "Fecha Mov"
                  ),
                  "EAN": field(m, "EAN", "ean"),
                  "Estado": field(m, "Estado", "estado"),
                  "Movimiento": field(m, "Movimiento", "movimiento"),
                  "Saldo": field(m, "Saldo", "saldo"),
                  "Transaccion": field(
                      m,
                      "Transaccion", "Transacción", "transaccion"
                  ),
                  "Nombre_empleado": field(
                      m,
                      "Nombre_empleado", "Nombre empleado", "NombreEmpleado"
                  ),
                  "Id_empleado": field(
                      m,
                      "Id_empleado", "ID empleado", "IdEmpleado"
                  ),
                  "NoControl": field(
                      m,
                      "NoControl", "No Control", "nocontrol"
                  )
              }

          def audit_ghost_box(caja, jwt):
              """
              Revisa getmovimientos de una caja relevada como etiqueta fantasma.
              Guarda el historial completo de movimientos de cada caja,
              además del resumen de primer/último evento y COUNTING_ERROR.
              """
              try:
                  payload = caja_api(
                      "getmovimientos",
                      caja,
                      jwt,
                      timeout=30
                  )
                  moves = extract_rows(payload)
                  ordered = sorted(
                      moves,
                      key=lambda m: parse_date(
                          field(
                              m,
                              "Fecha", "fecha",
                              "FechaHora", "Fecha Hora",
                              "FechaMovimiento", "Fecha Mov"
                          )
                      )
                  )

                  counting = [
                      m for m in ordered
                      if "COUNTING_ERROR" in str(
                          field(
                              m,
                              "Transaccion", "Transacción", "transaccion"
                          )
                      ).upper().replace(" ", "_")
                  ]

                  movimientos_completos = [
                      compact_movement_event(m)
                      for m in ordered
                  ]

                  return {
                      "ok": True,
                      "caja": str(caja).strip(),
                      "tiene_movimientos": bool(ordered),
                      "movimientos_count": len(ordered),
                      "movimientos": movimientos_completos,
                      "primer_movimiento": (
                          compact_movement_event(ordered[0])
                          if ordered else None
                      ),
                      "ultimo_movimiento": (
                          compact_movement_event(ordered[-1])
                          if ordered else None
                      ),
                      "counting_error_count": len(counting),
                      "ultimo_counting_error": (
                          compact_movement_event(counting[-1])
                          if counting else None
                      )
                  }
              except Exception as e:
                  return {
                      "ok": False,
                      "caja": str(caja).strip(),
                      "tiene_movimientos": None,
                      "movimientos_count": None,
                      "movimientos": [],
                      "counting_error_count": None,
                      "error": str(e)[:300]
                  }

          def query_ubicaciones(caja, jwt):
              payload = caja_api("getubicaciones", caja, jwt)
              return extract_rows(payload)

          def latest_move_to_process(moves):
              candidates = []

              for move in moves:
                  destino = field(
                      move,
                      "UbicacionFinal",
                      "ubicacion_final",
                      "ubicacionfinal"
                  )

                  if norm_value(destino) == "EN_PROCESO":
                      candidates.append(move)

              if not candidates:
                  return None

              return max(
                  candidates,
                  key=lambda x: parse_date(
                      field(
                          x,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                  )
              )

          def build_process_row(stock_row, trace_move=None, trace_error=""):
              return {
                  "Caja": field(stock_row, "Caja", "caja", "numeroCaja", "NroCaja"),
                  "EAN": field(stock_row, "EAN", "ean"),
                  "Referencia": field(stock_row, "referencia", "Referencia", "ref"),
                  "Descripcion": field(stock_row, "Descripcion", "descripcion", "Descripción"),
                  "Saldo": field(stock_row, "Saldo", "saldo", "Cantidad", "cantidad"),
                  "Unidad": field(stock_row, "UnidadMedida", "unidadMedida", "Unidad"),
                  "FV": field(stock_row, "FV", "fv", "FechaVencimiento"),
                  "Ubicacion": field(stock_row, "Ubicacion", "ubicacion") or "EN_PROCESO",
                  "PosicionOrigen": (
                      field(
                          trace_move,
                          "UbicacionInicial",
                          "ubicacion_inicial",
                          "ubicacionInicial"
                      )
                      if trace_move else ""
                  ),
                  "Maquinista": (
                      field(
                          trace_move,
                          "Nombre_empleado",
                          "NombreEmpleado",
                          "nombreEmpleado",
                          "Empleado"
                      )
                      if trace_move else ""
                  ),
                  "Id_maquinista": (
                      field(
                          trace_move,
                          "Id_empleado",
                          "IdEmpleado",
                          "idEmpleado"
                      )
                      if trace_move else ""
                  ),
                  "FechaIngresoProceso": (
                      field(
                          trace_move,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                      if trace_move else ""
                  ),
                  "Prioridad": (
                      field(trace_move, "Prioridad", "prioridad")
                      if trace_move else ""
                  ),
                  "Trazabilidad": (
                      "OK"
                      if trace_move
                      else (
                          trace_error
                          or "Sin movimiento a EN_PROCESO identificado"
                      )
                  )
              }

          def normalize_receipt_link(value):
              return (
                  str(value or "")
                  .strip()
                  .upper()
                  .replace(" ", "")
              )

          def receipt_key_variants(value):
              """
              Genera variantes compatibles entre:
              - Inventario Referencia: ord_no
              - Consulta Recibo: unido / doctoERP / numDocumento
              Ej.: 4501999143-4501999143 también genera 4501999143.
              """
              raw = normalize_receipt_link(value)
              if not raw:
                  return set()

              keys = {raw}
              parts = [p for p in raw.split("-") if p]

              if len(parts) == 2 and parts[0] == parts[1]:
                  keys.add(parts[0])

              return keys

          def receipt_date_window(receipt_rows):
              today = now_utc().date()
              candidates = []

              for row in receipt_rows:
                  raw = field(
                      row,
                      "fecharegistro", "FechaRegistro",
                      "f_ultimo_movimiento", "FechaUltimoMovimiento"
                  )
                  ts = parse_date(raw)
                  if ts != float("-inf"):
                      try:
                          candidates.append(
                              datetime.fromtimestamp(ts, timezone.utc).date()
                          )
                      except Exception:
                          pass

              # Buffer amplio porque una caja puede seguir en RECIBO aunque la OC
              # haya sido creada bastante antes del último movimiento.
              if candidates:
                  start = min(candidates) - timedelta(days=90)
              else:
                  start = today - timedelta(days=730)

              floor = today - timedelta(days=730)
              if start < floor:
                  start = floor

              return start.strftime("%Y%m%d"), today.strftime("%Y%m%d")

          def load_supplier_by_unido(receipt_rows, jwt):
              if not receipt_rows:
                  return {}, {"queried": 0, "matched_keys": 0}

              fecha_inicial, fecha_final = receipt_date_window(receipt_rows)

              # La pantalla de Consulta Recibo devuelve [] cuando documentooc va
              # vacío. Usamos como disparador una OC real presente hoy en RECIBO.
              documentooc_trigger = ""
              fallback_trigger = ""

              for row in receipt_rows:
                  raw_ord = str(
                      field(row, "ord_no", "OrdNo", "ordno") or ""
                  ).strip()

                  for key in receipt_key_variants(raw_ord):
                      if not fallback_trigger and key:
                          fallback_trigger = key

                      # Priorizar formato OC SAP observado: 45xxxxxxxx
                      if key.isdigit() and len(key) >= 10 and key.startswith("45"):
                          documentooc_trigger = key
                          break

                  if documentooc_trigger:
                      break

              if not documentooc_trigger:
                  documentooc_trigger = fallback_trigger

              print(
                  "PLANRECIBO documentooc disparador:",
                  documentooc_trigger or "(vacío)"
              )
              # Consulta Recibo: mantenemos los parámetros obligatorios de la
              # pantalla y agregamos el rango de fechas que usa el endpoint para
              # devolver recepciones históricas/actuales.

              # Copérnico devuelve [] cuando el rango es demasiado amplio.
              # Consultamos por bloques mensuales y acumulamos resultados.
              start_dt = datetime.strptime(fecha_inicial, "%Y%m%d").date()
              end_dt = datetime.strptime(fecha_final, "%Y%m%d").date()

              plan_rows = []
              total_bytes = 0
              monthly_calls = 0

              cursor = start_dt.replace(day=1)
              while cursor <= end_dt:
                  if cursor.month == 12:
                      next_month = cursor.replace(
                          year=cursor.year + 1,
                          month=1,
                          day=1
                      )
                  else:
                      next_month = cursor.replace(
                          month=cursor.month + 1,
                          day=1
                      )

                  chunk_start = max(start_dt, cursor)
                  chunk_end = min(end_dt, next_month - timedelta(days=1))

                  chunk_params = urllib.parse.urlencode({
                      "documentooc": documentooc_trigger,
                      "tipodeplaneacion": "12",
                      "estado": "1",
                      "tipodocto": "",
                      "bodega": "47",
                      "fecha_inicial": chunk_start.strftime("%Y%m%d"),
                      "fecha_final": chunk_end.strftime("%Y%m%d")
                  })

                  payload, http_status, size = request_json(
                      PLANRECIBO_URL + "?" + chunk_params,
                      method="GET",
                      jwt=jwt,
                      timeout=120
                  )

                  chunk_rows = extract_rows(payload)
                  plan_rows.extend(chunk_rows)
                  total_bytes += size
                  monthly_calls += 1

                  print(
                      "PLANRECIBO BLOQUE:",
                      chunk_start.strftime("%Y%m%d"),
                      "a",
                      chunk_end.strftime("%Y%m%d"),
                      "· HTTP:", http_status,
                      "· filas:", len(chunk_rows)
                  )

                  cursor = next_month

              # Deduplicar documentos devueltos en más de un bloque.
              deduped = []
              seen = set()
              for row in plan_rows:
                  signature = (
                      str(field(row, "id", "Id") or "").strip(),
                      str(field(row, "unido", "Unido") or "").strip(),
                      str(field(row, "doctoERP", "DoctoERP") or "").strip(),
                      str(field(row, "numDocumento", "NumDocumento") or "").strip()
                  )
                  if signature in seen:
                      continue
                  seen.add(signature)
                  deduped.append(row)

              plan_rows = deduped
              size = total_bytes

              supplier_by_key = {}

              for plan_row in plan_rows:
                  proveedor = str(
                      field(
                          plan_row,
                          "nombreProveedor", "NombreProveedor",
                          "proveedor", "Proveedor"
                      ) or ""
                  ).strip()

                  if not proveedor:
                      continue

                  # No dependemos de una sola columna del endpoint.
                  for raw_key in (
                      field(plan_row, "unido", "Unido"),
                      field(plan_row, "doctoERP", "DoctoERP"),
                      field(plan_row, "numDocumento", "NumDocumento"),
                      field(plan_row, "numdocumento")
                  ):
                      for key in receipt_key_variants(raw_key):
                          supplier_by_key[key] = proveedor

              stock_keys = []
              for row in receipt_rows:
                  raw = field(row, "ord_no", "OrdNo", "ordno")
                  stock_keys.extend(receipt_key_variants(raw))

              direct_hits = sum(1 for key in stock_keys if key in supplier_by_key)

              print(
                  "PLANRECIBO HTTP:", http_status,
                  "· estado: 1 · tipodeplaneacion: 12",
                  "· período:", fecha_inicial, "a", fecha_final,
                  "· bloques:", monthly_calls,
                  "· filas:", len(plan_rows),
                  "· claves proveedor:", len(supplier_by_key),
                  "· ord_no no vacíos:", len(stock_keys),
                  "· coincidencias de clave:", direct_hits,
                  "· bytes:", size
              )

              print("MUESTRA ord_no RECIBO:", stock_keys[:10])
              print("MUESTRA claves PLANRECIBO:", list(supplier_by_key.keys())[:10])

              return supplier_by_key, {
                  "queried": len(plan_rows),
                  "matched_keys": len(supplier_by_key),
                  "fecha_inicial": fecha_inicial,
                  "fecha_final": fecha_final,
                  "direct_hits": direct_hits
              }

          # -----------------------------
          # EN RECIBO
          # -----------------------------
          # Mapa opcional por ID. Si Copérnico devuelve Equipo/Puesto/Rol/Perfil
          # se usa ese dato; si no, completar acá los IDs conocidos.
          EMPLOYEE_TEAM_BY_ID = {
              # "3707": "Recepción",
              # "3824": "Reabastecimiento",
              # "3843": "Inventario",
          }

          def looks_like_receipt(value):
              text = norm_value(value)
              if not text:
                  return False
              return (
                  text == "RECIBO"
                  or "RECIB" in text
                  or "RECEPC" in text
              )

          def row_is_receipt(row):
              # Copérnico puede identificar recepción como ubicación, área, zona,
              # sector o estado. No asumimos un único campo.
              values = [
                  field(row, "Ubicacion", "ubicacion", "Location"),
                  field(row, "Area", "area", "Área"),
                  field(row, "Zona", "zona"),
                  field(row, "Sector", "sector"),
                  field(row, "Estado", "estado", "Estatus", "estatus"),
                  field(row, "TipoUbicacion", "tipo_ubicacion", "tipoUbicacion"),
                  field(row, "NombreUbicacion", "nombre_ubicacion", "nombreUbicacion"),
              ]
              return any(looks_like_receipt(v) for v in values)

          def latest_move_to_receipt(moves):
              candidates = []
              for move in moves:
                  destino_values = [
                      field(move, "UbicacionFinal", "ubicacion_final", "ubicacionfinal"),
                      field(move, "Ubicacion", "ubicacion", "Location"),
                      field(move, "AreaFinal", "area_final", "areaFinal"),
                      field(move, "ZonaFinal", "zona_final", "zonaFinal"),
                      field(move, "SectorFinal", "sector_final", "sectorFinal"),
                  ]
                  if any(looks_like_receipt(v) for v in destino_values):
                      candidates.append(move)
              if not candidates:
                  return None
              return max(
                  candidates,
                  key=lambda x: parse_date(
                      field(x, "fecha", "Fecha", "FechaMovimiento", "fecha_movimiento")
                  )
              )

          def employee_team(trace_move):
              if not trace_move:
                  return "Sin clasificar"
              direct = field(
                  trace_move,
                  "Equipo", "equipo", "Puesto", "puesto",
                  "Rol", "rol", "Perfil", "perfil", "Sector", "sector"
              )
              if str(direct).strip():
                  return str(direct).strip()
              emp_id = str(field(
                  trace_move, "Id_empleado", "IdEmpleado", "idEmpleado"
              ) or "").strip()
              return EMPLOYEE_TEAM_BY_ID.get(emp_id, "Sin clasificar")

          def build_receipt_row(stock_row, trace_move=None, trace_error="", proveedor=""):
              return {
                  "Caja": field(stock_row, "Caja", "caja", "numeroCaja", "NroCaja"),
                  "EAN": field(stock_row, "EAN", "ean"),
                  "Referencia": field(stock_row, "referencia", "Referencia", "ref"),
                  "Descripcion": field(stock_row, "Descripcion", "descripcion", "Descripción"),
                  "Saldo": field(stock_row, "Saldo", "saldo", "Cantidad", "cantidad"),
                  "Unidad": field(stock_row, "UnidadMedida", "unidadMedida", "Unidad"),
                  "FV": field(stock_row, "FV", "fv", "FechaVencimiento"),
                  "Ubicacion": field(stock_row, "Ubicacion", "ubicacion") or "RECIBO",
                  "PosicionOrigen": (field(trace_move, "UbicacionInicial", "ubicacion_inicial", "ubicacionInicial") if trace_move else ""),
                  "Responsable": (field(trace_move, "Nombre_empleado", "NombreEmpleado", "nombreEmpleado", "Empleado") if trace_move else ""),
                  "Id_empleado": (field(trace_move, "Id_empleado", "IdEmpleado", "idEmpleado") if trace_move else ""),
                  "Equipo": employee_team(trace_move),
                  "Proveedor": str(proveedor or "").strip() or "Sin asociar",
                  "FechaIngresoRecibo": (field(trace_move, "fecha", "Fecha", "FechaMovimiento", "fecha_movimiento") if trace_move else ""),
                  "Trazabilidad": ("OK" if trace_move else (trace_error or "Sin movimiento a RECIBO identificado"))
              }

          # -----------------------------
          # Estado persistente / backoff
          # -----------------------------
          status = load_json_file(
              STATUS_FILE,
              {
                  "status": "unknown",
                  "fail_count": 0,
                  "next_retry_at": None,
                  "last_success_at": None,
                  "last_attempt_at": None,
                  "message": ""
              }
          )

          now = now_utc()

          jwt = None
          user_id = None
          login_ok = False
          stock_updated = False
          main_error = None
          logout_error = None

          try:
              print("=== 1. LOGIN ===")

              try:
                  login, _, _ = request_json(
                      LOGIN_URL,
                      method="POST",
                      data={
                          "email": EMAIL,
                          "password": PASSWORD,
                          "plataforma": "Copernico WMS"
                      },
                      timeout=30
                  )
              except ApiError as e:
                  # Copérnico usa 403/418 para rechazos operativos de login
                  # (sesión técnica activa o falta de licencia/cupo).
                  detail_lower = (e.detail or "").lower()
                  recoverable = (
                      e.code in (403, 418)
                      and (
                          "sesión activa" in detail_lower
                          or "sesion activa" in detail_lower
                          or "licen" in detail_lower
                          or "cupo" in detail_lower
                      )
                  )

                  if recoverable:
                      learned_id = status.get("copernico_user_id")
                      tech_user_id = learned_id or DEFAULT_TECH_USER_ID

                      print(
                          f"LOGIN HTTP {e.code}. Intentando liberar sesión "
                          f"técnica ID {tech_user_id} y reintentar una vez..."
                      )

                      force_logout_by_id(tech_user_id)
                      time.sleep(2)

                      try:
                          login, _, _ = request_json(
                              LOGIN_URL,
                              method="POST",
                              data={
                                  "email": EMAIL,
                                  "password": PASSWORD,
                                  "plataforma": "Copernico WMS"
                              },
                              timeout=30
                          )
                          print("LOGIN RECUPERADO OK")

                      except ApiError as retry_error:
                          fail_count = int(status.get("fail_count", 0)) + 1
                          retry = now + timedelta(minutes=1)
                          retry_detail = (retry_error.detail or "").lower()

                          if (
                              "sesión activa" in retry_detail
                              or "sesion activa" in retry_detail
                          ):
                              reason = "Usuario técnico con sesión activa"
                          elif "licen" in retry_detail or "cupo" in retry_detail:
                              reason = "Sin licencia/cupo disponible"
                          else:
                              reason = (
                                  "Copérnico rechazó temporalmente el login "
                                  f"(HTTP {retry_error.code})"
                              )

                          status.update({
                              "status": "copernico_unavailable",
                              "fail_count": fail_count,
                              "next_retry_at": iso(retry),
                              "last_attempt_at": iso(now),
                              "message": reason,
                              "http_code": retry_error.code,
                              "detail": (retry_error.detail or "")[:300]
                          })

                          save_json_file(STATUS_FILE, status)

                          print("CONTINGENCIA:", reason)
                          print(
                              "El logout técnico no liberó una licencia; "
                              "se conserva el último dato válido."
                          )
                          print(
                              "Se reintentará automáticamente en el próximo minuto."
                          )
                          raise SystemExit(0)

                  elif e.code in (403, 418):
                      # Rechazo operativo no reconocido: conservar datos válidos.
                      fail_count = int(status.get("fail_count", 0)) + 1
                      retry = now + timedelta(minutes=1)
                      reason = (
                          "Copérnico rechazó temporalmente el login "
                          f"(HTTP {e.code})"
                      )
                      status.update({
                          "status": "copernico_unavailable",
                          "fail_count": fail_count,
                          "next_retry_at": iso(retry),
                          "last_attempt_at": iso(now),
                          "message": reason,
                          "http_code": e.code,
                          "detail": (e.detail or "")[:300]
                      })
                      save_json_file(STATUS_FILE, status)
                      print("CONTINGENCIA:", reason)
                      raise SystemExit(0)
                  else:
                      raise

              jwt = login.get("jwt")

              if not jwt:
                  raise RuntimeError(
                      "Login respondió correctamente pero no devolvió jwt"
                  )

              user_id = recursive_user_id(login)

              if user_id is None:
                  user_id = user_id_from_jwt(jwt)

              if user_id is None:
                  raise RuntimeError(
                      "No pude obtener el ID del usuario para realizar el logout"
                  )

              login_ok = True
              print("LOGIN OK")

              # -----------------------------
              # STOCK: prioridad absoluta
              # -----------------------------
              print("=== 2. STOCK BODEGA 47 ===")

              stock_response, stock_http, size = request_json(
                  STOCK_URL,
                  method="GET",
                  jwt=jwt,
                  timeout=180
              )

              rows = extract_rows(stock_response)

              if not rows:
                  raise RuntimeError(
                      "Copérnico respondió, pero no encontré filas de inventario"
                  )

              if len(rows) < 100:
                  raise RuntimeError(
                      f"Respuesta sospechosa: solamente {len(rows)} registros"
                  )

              now_iso = iso(now_utc())

              stock_payload = {
                  "updated_at": now_iso,
                  "source": "Copernico WMS · bodega 47 · GitHub Actions",
                  "row_count": len(rows),
                  "rows": rows
              }

              save_json_file(STOCK_FILE, stock_payload)
              stock_updated = True

              print("STOCK HTTP:", stock_http)
              print("Registros:", len(rows))
              print("stock.json generado correctamente")

              # A partir de acá, si algo secundario falla, stock igual queda válido.
              print("=== 3. PALLETS EN PROCESO ===")

              try:
                  process_stock_rows = [
                      row
                      for row in rows
                      if norm_value(
                          field(row, "Ubicacion", "ubicacion", "Location")
                      ) == "EN_PROCESO"
                  ]

                  process_boxes = sorted({
                      str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                      for row in process_stock_rows
                      if str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                  })

                  trace_by_box = {}

                  def trace_process_one(caja):
                      try:
                          moves = query_ubicaciones(caja, jwt)
                          event = latest_move_to_process(moves)
                          return caja, event, ""
                      except Exception as e:
                          return caja, None, str(e)[:300]

                  if process_boxes:
                      executor = ThreadPoolExecutor(
                          max_workers=min(8, len(process_boxes))
                      )

                      futures = {
                          executor.submit(trace_process_one, caja): caja
                          for caja in process_boxes
                      }

                      try:
                          for future in as_completed(futures, timeout=35):
                              caja = futures[future]
                              try:
                                  caja, event, error = future.result(timeout=1)
                              except Exception as e:
                                  event = None
                                  error = "Error aislado: " + str(e)[:250]

                              trace_by_box[caja] = {
                                  "event": event,
                                  "error": error
                              }
                      except Exception as e:
                          print(
                              "AVISO: trazabilidad EN_PROCESO incompleta:",
                              str(e)
                          )
                      finally:
                          executor.shutdown(
                              wait=False,
                              cancel_futures=True
                          )

                      for caja in process_boxes:
                          trace_by_box.setdefault(
                              caja,
                              {
                                  "event": None,
                                  "error": "Trazabilidad no disponible en este ciclo"
                              }
                          )

                  process_rows = []

                  for stock_row in process_stock_rows:
                      caja = str(
                          field(
                              stock_row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()

                      trace = trace_by_box.get(caja, {})

                      process_rows.append(
                          build_process_row(
                              stock_row,
                              trace_move=trace.get("event"),
                              trace_error=trace.get("error", "")
                          )
                      )

                  identified = sum(
                      1
                      for row in process_rows
                      if row["PosicionOrigen"] and row["Maquinista"]
                  )

                  save_json_file(
                      PALLETS_FILE,
                      {
                          "updated_at": now_iso,
                          "source": (
                              "Copernico WMS · EN_PROCESO · "
                              "trazabilidad de ubicaciones"
                          ),
                          "total_lineas": len(process_rows),
                          "total_pallets": len(process_boxes),
                          "identificados": identified,
                          "rows": process_rows
                      }
                  )

                  print("pallets-proceso.json generado correctamente")

              except Exception as e:
                  print(
                      "AVISO: pallets-proceso no pudo actualizarse. "
                      "Se conservará el último válido:",
                      str(e)
                  )

              # -----------------------------
              # EN RECIBO
              # -----------------------------
              print("=== 3B. EN RECIBO ===")

              try:
                  receipt_stock_rows = [row for row in rows if row_is_receipt(row)]

                  print("Filas detectadas en RECIBO/RECEPCION:", len(receipt_stock_rows))
                  if receipt_stock_rows:
                      sample_receipt = receipt_stock_rows[0]
                      print(
                          "Muestra recibo:",
                          {
                              "Ubicacion": field(sample_receipt, "Ubicacion", "ubicacion", "Location"),
                              "Area": field(sample_receipt, "Area", "area", "Área"),
                              "Zona": field(sample_receipt, "Zona", "zona"),
                              "Sector": field(sample_receipt, "Sector", "sector"),
                              "Estado": field(sample_receipt, "Estado", "estado", "Estatus", "estatus"),
                          }
                      )

                  receipt_boxes = sorted({
                      str(field(row, "Caja", "caja", "numeroCaja", "NroCaja")).strip()
                      for row in receipt_stock_rows
                      if str(field(row, "Caja", "caja", "numeroCaja", "NroCaja")).strip()
                  })

                  # Proveedor: se resuelve una vez por ciclo usando la relación nativa
                  # de Copérnico ord_no (Inventario Referencia) -> unido (Consulta Recibo).
                  supplier_by_unido = {}
                  supplier_stats = {}
                  try:
                      supplier_by_unido, supplier_stats = load_supplier_by_unido(
                          receipt_stock_rows,
                          jwt
                      )
                  except Exception as e:
                      # El proveedor es un enriquecimiento secundario: si falla, no se
                      # pierde ninguna caja de RECIBO ni se bloquea la actualización.
                      print(
                          "AVISO: no se pudo consultar proveedor en planrecibo:",
                          str(e)[:300]
                      )

                  receipt_trace_by_box = {}

                  def trace_receipt_one(caja):
                      try:
                          moves = query_ubicaciones(caja, jwt)
                          event = latest_move_to_receipt(moves)
                          return caja, event, ""
                      except Exception as e:
                          return caja, None, str(e)[:300]

                  if receipt_boxes:
                      executor = ThreadPoolExecutor(max_workers=min(8, len(receipt_boxes)))
                      futures = {executor.submit(trace_receipt_one, caja): caja for caja in receipt_boxes}
                      try:
                          for future in as_completed(futures, timeout=35):
                              caja = futures[future]
                              try:
                                  caja, event, error = future.result(timeout=1)
                              except Exception as e:
                                  event = None
                                  error = "Error aislado: " + str(e)[:250]
                              receipt_trace_by_box[caja] = {"event": event, "error": error}
                      except Exception as e:
                          print("AVISO: trazabilidad RECIBO incompleta:", str(e))
                      finally:
                          executor.shutdown(wait=False, cancel_futures=True)

                      for caja in receipt_boxes:
                          receipt_trace_by_box.setdefault(
                              caja, {"event": None, "error": "Trazabilidad no disponible en este ciclo"}
                          )

                  receipt_rows = []
                  for stock_row in receipt_stock_rows:
                      caja = str(field(stock_row, "Caja", "caja", "numeroCaja", "NroCaja")).strip()
                      trace = receipt_trace_by_box.get(caja, {})
                      proveedor = ""
                      stock_ord_no = field(stock_row, "ord_no", "OrdNo", "ordno")

                      for receipt_link in receipt_key_variants(stock_ord_no):
                          proveedor = supplier_by_unido.get(receipt_link, "")
                          if proveedor:
                              break

                      receipt_rows.append(build_receipt_row(
                          stock_row,
                          trace_move=trace.get("event"),
                          trace_error=trace.get("error", ""),
                          proveedor=proveedor
                      ))

                  identified_receipt = sum(1 for row in receipt_rows if row["Responsable"])
                  suppliers_identified = sum(
                      1 for row in receipt_rows
                      if row.get("Proveedor") and row.get("Proveedor") != "Sin asociar"
                  )

                  unmatched_provider_rows = []
                  for stock_row, receipt_row in zip(receipt_stock_rows, receipt_rows):
                      if receipt_row.get("Proveedor") != "Sin asociar":
                          continue

                      raw_ord_no = str(
                          field(stock_row, "ord_no", "OrdNo", "ordno") or ""
                      ).strip()

                      unmatched_provider_rows.append({
                          "Caja": receipt_row.get("Caja"),
                          "EAN": receipt_row.get("EAN"),
                          "Referencia": receipt_row.get("Referencia"),
                          "Descripcion": receipt_row.get("Descripcion"),
                          "ord_no": raw_ord_no,
                          "documentooc": str(
                              field(
                                  stock_row,
                                  "documentooc", "DocumentoOC",
                                  "documento_oc", "DocumentoOc"
                              ) or ""
                          ).strip(),
                          "PedProv": str(
                              field(stock_row, "PedProv", "pedprov", "pedProv") or ""
                          ).strip(),
                          "NumControl": str(
                              field(stock_row, "NumControl", "numcontrol", "numControl") or ""
                          ).strip(),
                          "Factura": str(
                              field(stock_row, "Factura", "factura") or ""
                          ).strip(),
                          "fecharegistro": str(
                              field(stock_row, "fecharegistro", "FechaRegistro") or ""
                          ).strip()
                      })

                  unmatched_ord_nos = sorted({
                      x["ord_no"] for x in unmatched_provider_rows if x["ord_no"]
                  })

                  print(
                      "Proveedor asociado:",
                      suppliers_identified,
                      "de",
                      len(receipt_rows),
                      "líneas actuales en RECIBO"
                  )
                  print(
                      "Sin proveedor:",
                      len(unmatched_provider_rows),
                      "líneas · ord_no únicos:",
                      len(unmatched_ord_nos)
                  )
                  print(
                      "MUESTRA SIN PROVEEDOR:",
                      unmatched_provider_rows[:20]
                  )
                  print(
                      "ORD_NO SIN PROVEEDOR:",
                      unmatched_ord_nos[:80]
                  )
                  save_json_file(
                      RECEIPT_FILE,
                      {
                          "updated_at": now_iso,
                          "source": "Copernico WMS · RECIBO · trazabilidad de ubicaciones",
                          "total_lineas": len(receipt_rows),
                          "total_cajas": len(receipt_boxes),
                          "identificados": identified_receipt,
                          "proveedores_identificados": suppliers_identified,
                          "proveedores_sin_asociar": len(unmatched_provider_rows),
                          "ord_no_sin_proveedor": unmatched_ord_nos,
                          "diagnostico_sin_proveedor": unmatched_provider_rows,
                          "rows": receipt_rows
                      }
                  )
                  print("en-recibo.json generado correctamente")
              except Exception as e:
                  print("AVISO: en-recibo no pudo actualizarse. Se conservará el último válido:", str(e))

              # -----------------------------
              # TRAZABILIDAD DE MEZCLA · COMPACTA v14
              # -----------------------------
              print("=== 4. TRAZABILIDAD DE MEZCLAS · COMPACTA ===")

              try:
                  by_location = {}

                  for row in rows:
                      ubicacion = str(
                          field(row, "Ubicacion", "ubicacion")
                      ).strip()

                      if not ubicacion:
                          continue

                      try:
                          saldo = float(field(row, "Saldo", "saldo"))
                      except Exception:
                          saldo = 0.0

                      if saldo <= 0:
                          continue

                      by_location.setdefault(ubicacion, []).append(row)

                  mixed_locations = {}
                  box_skus = {}

                  for ubicacion, loc_rows in by_location.items():
                      skus = {
                          str(
                              field(
                                  row,
                                  "EAN", "ean",
                                  "referencia", "Referencia"
                              )
                          ).strip()
                          for row in loc_rows
                          if str(
                              field(
                                  row,
                                  "EAN", "ean",
                                  "referencia", "Referencia"
                              )
                          ).strip()
                      }

                      if len(skus) < 2:
                          continue

                      boxes = set()
                      for row in loc_rows:
                          caja = str(
                              field(
                                  row,
                                  "Caja", "caja",
                                  "numeroCaja", "NroCaja"
                              )
                          ).strip()
                          if not caja:
                              continue

                          boxes.add(caja)

                          # El dashboard filtra movimientos por EAN exacto. Asociamos
                          # a cada caja todos los EAN actuales que aparecen en stock.
                          ean = str(field(row, "EAN", "ean")).strip()
                          referencia = str(
                              field(row, "referencia", "Referencia")
                          ).strip()
                          sku_for_trace = ean or referencia
                          if sku_for_trace:
                              box_skus.setdefault(caja, set()).add(sku_for_trace)

                      boxes = sorted(boxes)

                      mixed_locations[ubicacion] = {
                          "sku_count": len(skus),
                          "boxes": boxes
                      }

                  trace_boxes_sorted = sorted(box_skus)

                  previous_trace = load_json_file(TRACE_FILE, {})
                  previous_boxes = {}
                  # v15 vuelve incremental la trazabilidad: cada ciclo conserva
                  # las cajas válidas ya resueltas y prioriza las que faltan.
                  if (
                      isinstance(previous_trace, dict)
                      and previous_trace.get("schema_version") in (13, 14, 15)
                  ):
                      previous_boxes = previous_trace.get("boxes", {}) or {}

                  trace_dataset_boxes = {}

                  # Mantener lo ya resuelto evita que una caja vuelva a SIN DATOS
                  # sólo porque el endpoint de Copérnico estuvo lento en este ciclo.
                  for caja in trace_boxes_sorted:
                      key = str(caja)
                      old_box = previous_boxes.get(key)
                      if isinstance(old_box, dict) and old_box.get("ok"):
                          trace_dataset_boxes[key] = dict(old_box)

                  # Prioridad 1: cajas nunca resueltas / fallidas.
                  unresolved_boxes = [
                      caja for caja in trace_boxes_sorted
                      if not (
                          isinstance(previous_boxes.get(str(caja)), dict)
                          and previous_boxes.get(str(caja), {}).get("ok")
                      )
                  ]

                  # Prioridad 2: cajas válidas cuya firma de SKU cambió.
                  changed_boxes = []
                  legacy_boxes = []
                  for caja in trace_boxes_sorted:
                      old_box = previous_boxes.get(str(caja))
                      if not (isinstance(old_box, dict) and old_box.get("ok")):
                          continue

                      current_signature = sorted(
                          str(x).strip()
                          for x in box_skus.get(caja, set())
                          if str(x).strip()
                      )
                      old_signature = old_box.get("requested_skus")

                      if isinstance(old_signature, list):
                          if sorted(str(x).strip() for x in old_signature) != current_signature:
                              changed_boxes.append(caja)
                      elif previous_trace.get("schema_version") != 15:
                          # Las trazas v13/v14 siguen siendo utilizables. Se refrescan
                          # después de resolver todas las cajas que hoy están sin datos.
                          legacy_boxes.append(caja)

                  # Un lote acotado permite terminar el workflow cada minuto y, a la vez,
                  # acumular progreso hasta completar todas las mezclas.
                  TRACE_MAX_QUERIES_PER_CYCLE = 300
                  priority_queue = []
                  seen_queue = set()
                  for caja in unresolved_boxes + changed_boxes + legacy_boxes:
                      if caja in seen_queue:
                          continue
                      seen_queue.add(caja)
                      priority_queue.append(caja)

                  trace_query_boxes = priority_queue[:TRACE_MAX_QUERIES_PER_CYCLE]

                  print(
                      "Trazabilidad mezcla · cajas totales:",
                      len(trace_boxes_sorted),
                      "· ya válidas:",
                      len(trace_dataset_boxes),
                      "· pendientes:",
                      len(unresolved_boxes),
                      "· a consultar este ciclo:",
                      len(trace_query_boxes)
                  )

                  if trace_query_boxes:
                      executor = ThreadPoolExecutor(
                          max_workers=min(10, len(trace_query_boxes))
                      )

                      futures = {
                          executor.submit(
                              query_trace_compact,
                              caja,
                              jwt,
                              box_skus.get(caja, set())
                          ): caja
                          for caja in trace_query_boxes
                      }

                      try:
                          for future in as_completed(futures, timeout=52):
                              caja = futures[future]
                              try:
                                  result = future.result(timeout=1)
                              except Exception as e:
                                  result = {
                                      "ok": False,
                                      "caja": str(caja),
                                      "error": "Error aislado: " + str(e)[:250],
                                      "movimientos": [],
                                      "ubicaciones": [],
                                      "inventario": [],
                                      "compact": True
                                  }

                              if result.get("ok"):
                                  result["requested_skus"] = sorted(
                                      str(x).strip()
                                      for x in box_skus.get(caja, set())
                                      if str(x).strip()
                                  )
                                  result["trace_resolved_at"] = now_iso
                                  result.pop("stale_trace", None)
                                  result.pop("stale_reason", None)
                                  trace_dataset_boxes[str(caja)] = result
                              else:
                                  old_box = previous_boxes.get(str(caja))
                                  if isinstance(old_box, dict) and old_box.get("ok"):
                                      kept = dict(old_box)
                                      kept["stale_trace"] = True
                                      kept["stale_reason"] = (
                                          "Copérnico falló en este ciclo; se conserva "
                                          "la última trazabilidad válida."
                                      )
                                      trace_dataset_boxes[str(caja)] = kept
                                  else:
                                      trace_dataset_boxes[str(caja)] = result

                      except Exception as e:
                          print(
                              "AVISO: lote de trazabilidad incompleto; "
                              "el progreso válido se conserva para el próximo ciclo:",
                              str(e)
                          )

                      finally:
                          executor.shutdown(
                              wait=False,
                              cancel_futures=True
                          )

                  # Toda caja actual debe quedar representada en el JSON. Las que no
                  # alcanzaron a resolverse quedan pendientes y se priorizan en el próximo ciclo.
                  for caja in trace_boxes_sorted:
                      key = str(caja)
                      if key in trace_dataset_boxes:
                          continue

                      old_box = previous_boxes.get(key)
                      if isinstance(old_box, dict) and old_box.get("ok"):
                          kept = dict(old_box)
                          kept["stale_trace"] = True
                          kept["stale_reason"] = (
                              "Pendiente de refresco; se conserva la última trazabilidad válida."
                          )
                          trace_dataset_boxes[key] = kept
                      else:
                          trace_dataset_boxes[key] = {
                              "ok": False,
                              "caja": key,
                              "error": "Pendiente de trazabilidad; se reintentará automáticamente",
                              "movimientos": [],
                              "ubicaciones": [],
                              "inventario": [],
                              "compact": True,
                              "requested_skus": sorted(
                                  str(x).strip()
                                  for x in box_skus.get(caja, set())
                                  if str(x).strip()
                              )
                          }

                  payload_trace = {
                      "schema_version": 15,
                      "updated_at": now_iso,
                      "source": (
                          "Copernico WMS · trazabilidad compacta de mezclas"
                      ),
                      "criterion": (
                          "Por caja y SKU actual se publica únicamente el movimiento "
                          "que inicia la racha de saldo positivo vigente."
                      ),
                      "mixed_location_count": len(mixed_locations),
                      "pending_box_count": sum(
                          1 for x in trace_dataset_boxes.values()
                          if not (isinstance(x, dict) and x.get("ok"))
                      ),
                      "queried_this_cycle": len(trace_query_boxes),
                      "box_count": len(trace_dataset_boxes),
                      "box_ok_count": sum(
                          1 for x in trace_dataset_boxes.values()
                          if isinstance(x, dict) and x.get("ok")
                      ),
                      "box_error_count": sum(
                          1 for x in trace_dataset_boxes.values()
                          if not (isinstance(x, dict) and x.get("ok"))
                      ),
                      "locations": mixed_locations,
                      "boxes": trace_dataset_boxes
                  }

                  save_json_file(TRACE_FILE, payload_trace)

                  size_mb = TRACE_FILE.stat().st_size / (1024 * 1024)
                  print(
                      "trazabilidad-cajas.json compacto generado ·",
                      f"{size_mb:.2f} MB",
                      "· cajas:",
                      len(trace_dataset_boxes)
                  )

                  # Guardia explícita para evitar volver a chocar contra el límite
                  # duro de GitHub (100 MB). Con formato compacto debería quedar muy lejos.
                  if size_mb > 25:
                      raise RuntimeError(
                          f"Trazabilidad compacta inesperadamente grande: {size_mb:.2f} MB"
                      )

              except Exception as e:
                  print(
                      "AVISO: trazabilidad-cajas no pudo actualizarse. "
                      "Se conservará el último válido:",
                      str(e)
                  )

              # -----------------------------
              # 4B. AUDITORÍA DE CAJAS FANTASMA
              # -----------------------------
              print("=== 4B. AUDITORÍA CAJAS FANTASMA ===")

              try:
                  previous_ghost = load_json_file(GHOST_FILE, {})
                  previous_ghost_boxes = (
                      previous_ghost.get("boxes", {})
                      if isinstance(previous_ghost, dict)
                      else {}
                  )

                  ghost_results = {}
                  executor = ThreadPoolExecutor(
                      max_workers=min(8, len(GHOST_BOXES))
                  )

                  futures = {
                      executor.submit(
                          audit_ghost_box,
                          caja,
                          jwt
                      ): caja
                      for caja in GHOST_BOXES
                  }

                  try:
                      for future in as_completed(futures, timeout=50):
                          caja = futures[future]
                          try:
                              result = future.result(timeout=1)
                          except Exception as e:
                              result = {
                                  "ok": False,
                                  "caja": str(caja),
                                  "tiene_movimientos": None,
                                  "movimientos_count": None,
                                  "counting_error_count": None,
                                  "error": "Error aislado: " + str(e)[:250]
                              }

                          if not result.get("ok"):
                              old = previous_ghost_boxes.get(str(caja))
                              if isinstance(old, dict) and old.get("ok"):
                                  result = dict(old)
                                  result["stale_trace"] = True
                                  result["stale_reason"] = (
                                      "Se conserva auditoría anterior porque "
                                      "la consulta no terminó en este ciclo."
                                  )

                          ghost_results[str(caja)] = result

                  except Exception as e:
                      print(
                          "AVISO: auditoría de cajas fantasma incompleta:",
                          str(e)
                      )

                  finally:
                      executor.shutdown(
                          wait=False,
                          cancel_futures=True
                      )

                  for caja in GHOST_BOXES:
                      key = str(caja)
                      if key in ghost_results:
                          continue

                      old = previous_ghost_boxes.get(key)
                      if isinstance(old, dict) and old.get("ok"):
                          kept = dict(old)
                          kept["stale_trace"] = True
                          kept["stale_reason"] = (
                              "No terminó la consulta en este ciclo; "
                              "se conserva el último resultado válido."
                          )
                          ghost_results[key] = kept
                      else:
                          ghost_results[key] = {
                              "ok": False,
                              "caja": key,
                              "tiene_movimientos": None,
                              "movimientos_count": None,
                              "counting_error_count": None,
                              "error": "Auditoría no disponible en este ciclo"
                          }

                  ghost_payload = {
                      "schema_version": 2,
                      "updated_at": now_iso,
                      "source": (
                          "Copernico WMS · auditoría de etiquetas/cajas fantasma"
                      ),
                      "criterion": (
                          "Se consulta getmovimientos para las 119 cajas únicas "
                          "de la columna ETIQUETA del relevamiento. Se publica el "
                          "historial completo de movimientos de cada caja recuperada."
                      ),
                      "box_count": len(GHOST_BOXES),
                      "consulted_ok_count": sum(
                          1 for x in ghost_results.values()
                          if isinstance(x, dict) and x.get("ok")
                      ),
                      "with_movements_count": sum(
                          1 for x in ghost_results.values()
                          if isinstance(x, dict)
                          and x.get("ok")
                          and x.get("tiene_movimientos") is True
                      ),
                      "without_movements_count": sum(
                          1 for x in ghost_results.values()
                          if isinstance(x, dict)
                          and x.get("ok")
                          and x.get("tiene_movimientos") is False
                      ),
                      "counting_error_boxes_count": sum(
                          1 for x in ghost_results.values()
                          if isinstance(x, dict)
                          and x.get("ok")
                          and (x.get("counting_error_count") or 0) > 0
                      ),
                      "boxes": ghost_results
                  }

                  save_json_file(GHOST_FILE, ghost_payload)

                  ghost_size_mb = GHOST_FILE.stat().st_size / (1024 * 1024)
                  print(
                      "cajas-fantasma-movimientos.json generado ·",
                      f"{ghost_size_mb:.2f} MB",
                      "· cajas con movimientos:",
                      ghost_payload["with_movements_count"],
                      "· cajas con COUNTING_ERROR:",
                      ghost_payload["counting_error_boxes_count"]
                  )

              except Exception as e:
                  print(
                      "AVISO: auditoría de cajas fantasma no pudo actualizarse. "
                      "Se conservará el último válido:",
                      str(e)
                  )

              # Éxito general: reset backoff.
              status.update({
                  "status": "ok",
                  "fail_count": 0,
                  "next_retry_at": None,
                  "last_success_at": now_iso,
                  "last_attempt_at": now_iso,
                  "message": "Actualización correcta",
                  "http_code": 200,
                  "detail": ""
              })

              save_json_file(
                  STATUS_FILE,
                  status
              )

          except SystemExit:
              raise

          except Exception as e:
              main_error = e

              # Error genérico: no pisa datos válidos; deja estado.
              fail_count = int(status.get("fail_count", 0)) + 1
              retry = now_utc() + timedelta(minutes=1)

              status.update({
                  "status": "error",
                  "fail_count": fail_count,
                  "next_retry_at": iso(retry),
                  "last_attempt_at": iso(now_utc()),
                  "message": "Error de actualización; se conserva último dato válido",
                  "detail": str(e)[:300]
              })

              save_json_file(
                  STATUS_FILE,
                  status
              )

          finally:
              if jwt and user_id is not None:
                  print("=== 5. LOGOUT ===")

                  try:
                      _, logout_status, _ = request_json(
                          LOGOUT_URL,
                          method="POST",
                          data={"id": user_id},
                          jwt=jwt,
                          timeout=30
                      )

                      print("LOGOUT HTTP:", logout_status)
                      print("LOGOUT OK")

                  except Exception as e:
                      logout_error = e
                      print("ERROR LOGOUT:", str(e))

          # Importante:
          # No hacemos fallar el workflow por indisponibilidad operativa.
          # Así sí se publica sync-status.json.
          if main_error:
              print("ERROR CONTROLADO:", str(main_error))

          if logout_error:
              print("AVISO LOGOUT:", str(logout_error))

          print("=== CICLO FINALIZADO ===")
          PY

      - name: Publicar estado y datos válidos
        run: |
          git config user.name "UBICACIONES AutoSync"
          git config user.email "actions@github.com"

          mkdir -p /tmp/ubicaciones-sync

          for f in stock.json pallets-proceso.json en-recibo.json trazabilidad-cajas.json cajas-fantasma-movimientos.json sync-status.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/ubicaciones-sync/$f"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          for f in stock.json pallets-proceso.json en-recibo.json trazabilidad-cajas.json cajas-fantasma-movimientos.json sync-status.json; do
            if [ -f "/tmp/ubicaciones-sync/$f" ]; then
              cp "/tmp/ubicaciones-sync/$f" "$f"
            fi
          done

          git add stock.json pallets-proceso.json en-recibo.json trazabilidad-cajas.json cajas-fantasma-movimientos.json sync-status.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "AutoSync Copérnico · datos y estado"
          git push origin HEAD:main
