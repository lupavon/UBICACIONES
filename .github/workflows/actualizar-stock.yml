name: Actualizar datos Copernico

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-copernico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar Copernico con contingencia
        env:
          COPERNICO_EMAIL: ${{ secrets.COPERNICO_EMAIL }}
          COPERNICO_PASSWORD: ${{ secrets.COPERNICO_PASSWORD }}
        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          import urllib.parse
          import http.cookiejar
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          LOGIN_URL = "https://services.copernicowms.com/users/api/login"
          STOCK_URL = "https://services.copernicowms.com/backweb25/inventario/obtenerrefsxcaja?bodega=47"
          CAJA_API_BASE = "https://services.copernicowms.com/backweb25/caja/"
          LOGOUT_URL = "https://services.copernicowms.com/users/api/logout"

          EMAIL = os.environ["COPERNICO_EMAIL"]
          PASSWORD = os.environ["COPERNICO_PASSWORD"]

          STATUS_FILE = Path("sync-status.json")
          STOCK_FILE = Path("stock.json")
          PALLETS_FILE = Path("pallets-proceso.json")
          TRACE_FILE = Path("trazabilidad-cajas.json")
          DEFAULT_TECH_USER_ID = 11257

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar)
          )

          BASE_HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://copernicowms.com",
              "Referer": "https://copernicowms.com/",
              "User-Agent": "Mozilla/5.0"
          }

          class ApiError(RuntimeError):
              def __init__(self, code, detail, url):
                  super().__init__(f"HTTP {code}: {detail}")
                  self.code = code
                  self.detail = detail
                  self.url = url

          def now_utc():
              return datetime.now(timezone.utc)

          def iso(dt):
              return dt.astimezone(timezone.utc).isoformat()

          def load_json_file(path, default):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json_file(path, payload):
              path.write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

          def force_logout_by_id(user_id, jwt=None):
              """
              Libera una sesión técnica anterior usando el ID ya aprendido
              en una ejecución exitosa. Se usa solo cuando el login responde
              explícitamente 'sesión activa'.
              """
              if user_id is None:
                  return False

              headers = dict(BASE_HEADERS)
              headers["Content-Type"] = "application/json"

              if jwt:
                  headers["Authorization"] = jwt

              req = urllib.request.Request(
                  LOGOUT_URL,
                  data=json.dumps({"id": user_id}).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with opener.open(req, timeout=20) as response:
                      response.read()
                      print("LOGOUT DE RECUPERACIÓN HTTP:", response.status)
                      return 200 <= response.status < 300
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode("utf-8", errors="replace")[:300]
                  except Exception:
                      detail = ""
                  print("LOGOUT DE RECUPERACIÓN FALLÓ:", e.code, detail)
                  return False
              except Exception as e:
                  print("LOGOUT DE RECUPERACIÓN FALLÓ:", str(e))
                  return False

          def login_once():
              return request_json(
                  LOGIN_URL,
                  method="POST",
                  data={
                      "email": EMAIL,
                      "password": PASSWORD,
                      "plataforma": "Copernico WMS"
                  },
                  timeout=30
              )

          def request_json(url, method="GET", data=None, jwt=None, timeout=120):
              headers = dict(BASE_HEADERS)

              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode("utf-8")
              else:
                  body = None

              if jwt:
                  headers["Authorization"] = jwt

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with opener.open(req, timeout=timeout) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )[:700]
                  except Exception:
                      detail = ""
                  raise ApiError(e.code, detail, url)

              try:
                  parsed = json.loads(raw.decode("utf-8"))
              except Exception:
                  raise RuntimeError(
                      f"{method} {url} respondió HTTP {status}, "
                      "pero no devolvió JSON"
                  )

              return parsed, status, len(raw)

          def recursive_user_id(obj):
              preferred = {
                  "id",
                  "userid",
                  "user_id",
                  "idusuario",
                  "id_usuario",
                  "usuarioid",
                  "usuario_id"
              }

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      normalized = str(key).lower().replace("-", "_")
                      if normalized in preferred:
                          if isinstance(value, int):
                              return value
                          if isinstance(value, str) and value.isdigit():
                              return int(value)

                  for value in obj.values():
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              elif isinstance(obj, list):
                  for value in obj:
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              return None

          def user_id_from_jwt(token):
              try:
                  parts = token.split(".")
                  if len(parts) < 2:
                      return None

                  payload = parts[1]
                  payload += "=" * (-len(payload) % 4)

                  decoded = base64.urlsafe_b64decode(payload)
                  claims = json.loads(decoded.decode("utf-8"))

                  found = recursive_user_id(claims)
                  if found is not None:
                      return found

                  sub = claims.get("sub")
                  if isinstance(sub, int):
                      return sub
                  if isinstance(sub, str) and sub.isdigit():
                      return int(sub)

              except Exception:
                  pass

              return None

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "rows", "data", "items", "result",
                  "results", "stock", "inventario"
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for subkey in (
                          "rows", "data", "items",
                          "results", "stock"
                      ):
                          subvalue = value.get(subkey)
                          if isinstance(subvalue, list):
                              return subvalue

              return []

          def norm_key(value):
              return (
                  str(value)
                  .strip()
                  .lower()
                  .replace(" ", "")
                  .replace("_", "")
                  .replace("-", "")
              )

          def field(row, *names):
              if not isinstance(row, dict):
                  return ""

              indexed = {
                  norm_key(k): v
                  for k, v in row.items()
              }

              for name in names:
                  key = norm_key(name)
                  if key in indexed:
                      value = indexed[key]
                      if value is not None:
                          return value

              return ""

          def norm_value(value):
              return str(value or "").strip().upper()

          def parse_date(value):
              if value is None or value == "":
                  return float("-inf")

              if isinstance(value, (int, float)):
                  return float(value)

              text = str(value).strip()

              formats = (
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M"
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(text, fmt).timestamp()
                  except Exception:
                      pass

              try:
                  return datetime.fromisoformat(
                      text.replace("Z", "+00:00")
                  ).timestamp()
              except Exception:
                  return float("-inf")

          def caja_api(endpoint, caja, jwt, timeout=35):
              q = urllib.parse.quote(str(caja).strip(), safe="")
              url = CAJA_API_BASE + endpoint + "?caja=" + q
              payload, _, _ = request_json(
                  url,
                  method="GET",
                  jwt=jwt,
                  timeout=timeout
              )
              return payload

          def compact_trace_movements(payload, max_rows=250):
              """
              Conserva solamente los campos que usa el dashboard para determinar
              quién generó la mezcla. Esto evita publicar el payload bruto de
              Copérnico (que superó 100 MB en GitHub).
              """
              rows = extract_rows(payload)

              compact = []
              for r in rows:
                  if not isinstance(r, dict):
                      continue

                  item = {
                      "Fecha": field(
                          r,
                          "Fecha",
                          "FechaHora",
                          "Fecha Hora",
                          "FechaMovimiento",
                          "Fecha Mov"
                      ),
                      "EAN": field(r, "EAN", "ean"),
                      "Saldo": field(r, "Saldo", "saldo"),
                      "Movimiento": field(r, "Movimiento", "movimiento"),
                      "Estado": field(r, "Estado", "estado"),
                      "Transaccion": field(
                          r,
                          "Transaccion",
                          "Transacción",
                          "transaccion"
                      ),
                      "Nombre_empleado": field(
                          r,
                          "Nombre_empleado",
                          "Nombre empleado",
                          "NombreEmpleado"
                      ),
                      "Id_empleado": field(
                          r,
                          "Id_empleado",
                          "ID empleado",
                          "IdEmpleado"
                      ),
                      "NoControl": field(
                          r,
                          "NoControl",
                          "No Control",
                          "nocontrol"
                      )
                  }

                  # Eliminar claves vacías para reducir todavía más el JSON.
                  item = {
                      k: v
                      for k, v in item.items()
                      if v is not None and str(v).strip() != ""
                  }

                  if item:
                      compact.append(item)

              # Orden cronológico, y limitar a los últimos movimientos.
              compact.sort(
                  key=lambda x: parse_date(
                      field(
                          x,
                          "Fecha",
                          "FechaHora",
                          "FechaMovimiento"
                      )
                  )
              )

              if max_rows and len(compact) > max_rows:
                  compact = compact[-max_rows:]

              return compact

          def query_trace_full(caja, jwt):
              """
              Para detectar quién generó una mezcla actual, el dashboard usa
              exclusivamente el historial de MOVIMIENTOS por caja/SKU:
              Fecha, EAN, Movimiento, Saldo, Estado, Nombre_empleado e Id_empleado.

              Evitamos consultar getubicaciones + getinventario para cada caja
              porque triplicaba las llamadas y dejaba muchas cajas sin datos
              antes del timeout.
              """
              try:
                  movimientos_raw = caja_api(
                      "getmovimientos",
                      caja,
                      jwt,
                      timeout=25
                  )

                  movimientos = compact_trace_movements(
                      movimientos_raw,
                      max_rows=250
                  )

                  return {
                      "ok": True,
                      "caja": str(caja).strip(),
                      "movimientos": movimientos,
                      "movimiento_count": len(movimientos)
                  }
              except Exception as e:
                  return {
                      "ok": False,
                      "caja": str(caja).strip(),
                      "error": str(e)[:300],
                      "movimientos": []
                  }

          def query_ubicaciones(caja, jwt):
              payload = caja_api("getubicaciones", caja, jwt)
              return extract_rows(payload)

          def latest_move_to_process(moves):
              candidates = []

              for move in moves:
                  destino = field(
                      move,
                      "UbicacionFinal",
                      "ubicacion_final",
                      "ubicacionfinal"
                  )

                  if norm_value(destino) == "EN_PROCESO":
                      candidates.append(move)

              if not candidates:
                  return None

              return max(
                  candidates,
                  key=lambda x: parse_date(
                      field(
                          x,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                  )
              )

          def build_process_row(stock_row, trace_move=None, trace_error=""):
              return {
                  "Caja": field(stock_row, "Caja", "caja", "numeroCaja", "NroCaja"),
                  "EAN": field(stock_row, "EAN", "ean"),
                  "Referencia": field(stock_row, "referencia", "Referencia", "ref"),
                  "Descripcion": field(stock_row, "Descripcion", "descripcion", "Descripción"),
                  "Saldo": field(stock_row, "Saldo", "saldo", "Cantidad", "cantidad"),
                  "Unidad": field(stock_row, "UnidadMedida", "unidadMedida", "Unidad"),
                  "FV": field(stock_row, "FV", "fv", "FechaVencimiento"),
                  "Ubicacion": field(stock_row, "Ubicacion", "ubicacion") or "EN_PROCESO",
                  "PosicionOrigen": (
                      field(
                          trace_move,
                          "UbicacionInicial",
                          "ubicacion_inicial",
                          "ubicacionInicial"
                      )
                      if trace_move else ""
                  ),
                  "Maquinista": (
                      field(
                          trace_move,
                          "Nombre_empleado",
                          "NombreEmpleado",
                          "nombreEmpleado",
                          "Empleado"
                      )
                      if trace_move else ""
                  ),
                  "Id_maquinista": (
                      field(
                          trace_move,
                          "Id_empleado",
                          "IdEmpleado",
                          "idEmpleado"
                      )
                      if trace_move else ""
                  ),
                  "FechaIngresoProceso": (
                      field(
                          trace_move,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                      if trace_move else ""
                  ),
                  "Prioridad": (
                      field(trace_move, "Prioridad", "prioridad")
                      if trace_move else ""
                  ),
                  "Trazabilidad": (
                      "OK"
                      if trace_move
                      else (
                          trace_error
                          or "Sin movimiento a EN_PROCESO identificado"
                      )
                  )
              }

          # -----------------------------
          # Estado persistente / backoff
          # -----------------------------
          status = load_json_file(
              STATUS_FILE,
              {
                  "status": "unknown",
                  "fail_count": 0,
                  "next_retry_at": None,
                  "last_success_at": None,
                  "last_attempt_at": None,
                  "message": ""
              }
          )

          now = now_utc()

          jwt = None
          user_id = None
          login_ok = False
          stock_updated = False
          main_error = None
          logout_error = None

          try:
              print("=== 1. LOGIN ===")

              try:
                  login, _, _ = login_once()

              except ApiError as e:
                  if e.code == 403:
                      detail_lower = (e.detail or "").lower()
                      session_active = (
                          "sesión activa" in detail_lower
                          or "sesion activa" in detail_lower
                      )

                      # Si el usuario técnico quedó con una sesión huérfana,
                      # usamos el ID aprendido en el último login exitoso,
                      # cerramos esa sesión y reintentamos UNA sola vez.
                      if session_active:
                          known_user_id = status.get("copernico_user_id") or DEFAULT_TECH_USER_ID

                          if known_user_id is not None:
                              print(
                                  "SESIÓN ACTIVA DETECTADA. "
                                  "Intentando liberar sesión técnica anterior..."
                              )

                              released = force_logout_by_id(
                                  known_user_id
                              )

                              if released:
                                  print(
                                      "Sesión anterior liberada. "
                                      "Reintentando login..."
                                  )

                                  try:
                                      login, _, _ = login_once()
                                      print("LOGIN RECUPERADO OK")
                                  except ApiError as retry_error:
                                      e = retry_error
                                  else:
                                      e = None

                      if e is not None:
                          fail_count = int(status.get("fail_count", 0)) + 1
                          retry = now + timedelta(minutes=1)

                          detail_lower = (e.detail or "").lower()

                          if (
                              "sesión activa" in detail_lower
                              or "sesion activa" in detail_lower
                          ):
                              reason = "Usuario técnico con sesión activa"
                          elif "licen" in detail_lower or "cupo" in detail_lower:
                              reason = "Sin licencia/cupo disponible"
                          else:
                              reason = (
                                  "Copérnico rechazó temporalmente "
                                  "el login (HTTP 403)"
                              )

                          status.update({
                              "status": "copernico_unavailable",
                              "fail_count": fail_count,
                              "next_retry_at": iso(retry),
                              "last_attempt_at": iso(now),
                              "message": reason,
                              "http_code": 403,
                              "detail": (e.detail or "")[:300]
                          })

                          save_json_file(STATUS_FILE, status)

                          print("CONTINGENCIA:", reason)

                          if session_active:
                              print(
                                  "ID técnico usado para recuperación:",
                                  known_user_id
                              )

                          print(
                              "Se conserva stock/pallets/trazabilidad anteriores."
                          )
                          print(
                              "Se reintentará automáticamente "
                              "en el próximo minuto."
                          )
                          raise SystemExit(0)

                  else:
                      raise

              jwt = login.get("jwt")

              if not jwt:
                  raise RuntimeError(
                      "Login respondió correctamente pero no devolvió jwt"
                  )

              user_id = recursive_user_id(login)

              if user_id is None:
                  user_id = user_id_from_jwt(jwt)

              if user_id is None:
                  raise RuntimeError(
                      "No pude obtener el ID del usuario para realizar el logout"
                  )

              login_ok = True
              print("LOGIN OK")

              # -----------------------------
              # STOCK: prioridad absoluta
              # -----------------------------
              print("=== 2. STOCK BODEGA 47 ===")

              stock_response, stock_http, size = request_json(
                  STOCK_URL,
                  method="GET",
                  jwt=jwt,
                  timeout=180
              )

              rows = extract_rows(stock_response)

              if not rows:
                  raise RuntimeError(
                      "Copérnico respondió, pero no encontré filas de inventario"
                  )

              if len(rows) < 100:
                  raise RuntimeError(
                      f"Respuesta sospechosa: solamente {len(rows)} registros"
                  )

              now_iso = iso(now_utc())

              stock_payload = {
                  "updated_at": now_iso,
                  "source": "Copernico WMS · bodega 47 · GitHub Actions",
                  "row_count": len(rows),
                  "rows": rows
              }

              save_json_file(STOCK_FILE, stock_payload)
              stock_updated = True

              print("STOCK HTTP:", stock_http)
              print("Registros:", len(rows))
              print("stock.json generado correctamente")

              # A partir de acá, si algo secundario falla, stock igual queda válido.
              print("=== 3. PALLETS EN PROCESO ===")

              try:
                  process_stock_rows = [
                      row
                      for row in rows
                      if norm_value(
                          field(row, "Ubicacion", "ubicacion", "Location")
                      ) == "EN_PROCESO"
                  ]

                  process_boxes = sorted({
                      str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                      for row in process_stock_rows
                      if str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                  })

                  trace_by_box = {}

                  def trace_process_one(caja):
                      try:
                          moves = query_ubicaciones(caja, jwt)
                          event = latest_move_to_process(moves)
                          return caja, event, ""
                      except Exception as e:
                          return caja, None, str(e)[:300]

                  if process_boxes:
                      executor = ThreadPoolExecutor(
                          max_workers=min(8, len(process_boxes))
                      )

                      futures = {
                          executor.submit(trace_process_one, caja): caja
                          for caja in process_boxes
                      }

                      try:
                          for future in as_completed(futures, timeout=35):
                              caja = futures[future]
                              try:
                                  caja, event, error = future.result(timeout=1)
                              except Exception as e:
                                  event = None
                                  error = "Error aislado: " + str(e)[:250]

                              trace_by_box[caja] = {
                                  "event": event,
                                  "error": error
                              }
                      except Exception as e:
                          print(
                              "AVISO: trazabilidad EN_PROCESO incompleta:",
                              str(e)
                          )
                      finally:
                          executor.shutdown(
                              wait=False,
                              cancel_futures=True
                          )

                      for caja in process_boxes:
                          trace_by_box.setdefault(
                              caja,
                              {
                                  "event": None,
                                  "error": "Trazabilidad no disponible en este ciclo"
                              }
                          )

                  process_rows = []

                  for stock_row in process_stock_rows:
                      caja = str(
                          field(
                              stock_row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()

                      trace = trace_by_box.get(caja, {})

                      process_rows.append(
                          build_process_row(
                              stock_row,
                              trace_move=trace.get("event"),
                              trace_error=trace.get("error", "")
                          )
                      )

                  identified = sum(
                      1
                      for row in process_rows
                      if row["PosicionOrigen"] and row["Maquinista"]
                  )

                  save_json_file(
                      PALLETS_FILE,
                      {
                          "updated_at": now_iso,
                          "source": (
                              "Copernico WMS · EN_PROCESO · "
                              "trazabilidad de ubicaciones"
                          ),
                          "total_lineas": len(process_rows),
                          "total_pallets": len(process_boxes),
                          "identificados": identified,
                          "rows": process_rows
                      }
                  )

                  print("pallets-proceso.json generado correctamente")

              except Exception as e:
                  print(
                      "AVISO: pallets-proceso no pudo actualizarse. "
                      "Se conservará el último válido:",
                      str(e)
                  )

              # -----------------------------
              # TRAZABILIDAD DE MEZCLA · INCREMENTAL POR POSICIÓN
              # -----------------------------
              print("=== 4. TRAZABILIDAD DE MEZCLAS ===")

              try:
                  previous_trace = load_json_file(TRACE_FILE, {})
                  previous_locations = (
                      previous_trace.get("locations", {})
                      if isinstance(previous_trace, dict)
                      else {}
                  )

                  by_location = {}

                  for row in rows:
                      ubicacion = str(
                          field(row, "Ubicacion", "ubicacion")
                      ).strip()

                      if not ubicacion:
                          continue

                      try:
                          saldo = float(field(row, "Saldo", "saldo"))
                      except Exception:
                          saldo = 0.0

                      if saldo <= 0:
                          continue

                      by_location.setdefault(ubicacion, []).append(row)

                  current_mixed = {}

                  for ubicacion, loc_rows in by_location.items():
                      sku_map = {}
                      box_skus = {}
                      boxes = []

                      for row in loc_rows:
                          sku = str(
                              field(
                                  row,
                                  "EAN", "ean",
                                  "referencia", "Referencia"
                              )
                          ).strip()

                          if sku:
                              sku_map.setdefault(
                                  sku,
                                  {
                                      "ean": str(
                                          field(row, "EAN", "ean")
                                      ).strip(),
                                      "referencia": str(
                                          field(
                                              row,
                                              "referencia",
                                              "Referencia"
                                          )
                                      ).strip(),
                                      "descripcion": str(
                                          field(
                                              row,
                                              "Descripcion",
                                              "descripcion",
                                              "Descripción"
                                          )
                                      ).strip()
                                  }
                              )

                          caja = str(
                              field(
                                  row,
                                  "Caja", "caja",
                                  "numeroCaja", "NroCaja"
                              )
                          ).strip()

                          if caja:
                              if caja not in boxes:
                                  boxes.append(caja)

                              if sku:
                                  box_skus.setdefault(caja, [])
                                  if sku not in box_skus[caja]:
                                      box_skus[caja].append(sku)

                      if len(sku_map) < 2:
                          continue

                      boxes = sorted(boxes)
                      signature = "|".join(
                          boxes
                          + ["#"]
                          + sorted(sku_map.keys())
                          + ["#"]
                          + [
                              caja + ":" + ",".join(
                                  sorted(box_skus.get(caja, []))
                              )
                              for caja in boxes
                          ]
                      )

                      current_mixed[ubicacion] = {
                          "sku_count": len(sku_map),
                          "boxes": boxes,
                          "current_skus": list(sku_map.values()),
                          "box_skus": box_skus,
                          "signature": signature
                      }

                  resolved_locations = {}
                  pending_locations = {}

                  for ubicacion, info in current_mixed.items():
                      old = previous_locations.get(ubicacion, {})

                      # Reutilizar únicamente resultados DETECTADOS cuya
                      # composición actual no cambió.
                      if (
                          old.get("signature") == info["signature"]
                          and old.get("analysis", {}).get("status")
                          == "detected"
                      ):
                          resolved_locations[ubicacion] = old
                      else:
                          pending_locations[ubicacion] = info

                  print(
                      "Posiciones mezcladas actuales:",
                      len(current_mixed),
                      "| cache resuelta:",
                      len(resolved_locations),
                      "| pendientes:",
                      len(pending_locations)
                  )

                  # Consultar solo cajas pertenecientes a posiciones pendientes.
                  boxes_needed = sorted({
                      caja
                      for info in pending_locations.values()
                      for caja in info.get("boxes", [])
                  })

                  print(
                      "Cajas únicas a consultar este ciclo:",
                      len(boxes_needed)
                  )

                  box_history = {}

                  def query_box_location_history(caja):
                      try:
                          hist = query_ubicaciones(caja, jwt)
                          compact = []

                          for m in hist:
                              compact.append({
                                  "UbicacionInicial": field(
                                      m,
                                      "UbicacionInicial",
                                      "ubicacion_inicial",
                                      "ubicacionInicial"
                                  ),
                                  "UbicacionFinal": field(
                                      m,
                                      "UbicacionFinal",
                                      "ubicacion_final",
                                      "ubicacionFinal"
                                  ),
                                  "fecha": field(
                                      m,
                                      "fecha", "Fecha",
                                      "FechaMovimiento",
                                      "fecha_movimiento"
                                  ),
                                  "Nombre_empleado": field(
                                      m,
                                      "Nombre_empleado",
                                      "NombreEmpleado",
                                      "nombreEmpleado",
                                      "Empleado"
                                  ),
                                  "Id_empleado": field(
                                      m,
                                      "Id_empleado",
                                      "IdEmpleado",
                                      "idEmpleado"
                                  ),
                                  "Prioridad": field(
                                      m,
                                      "Prioridad",
                                      "prioridad"
                                  )
                              })

                          return str(caja), compact, ""

                      except Exception as e:
                          return str(caja), [], str(e)[:300]

                  # Límite de trabajo por ciclo: si aparecen muchísimas cajas,
                  # se procesan por tandas y el próximo minuto continúa.
                  MAX_BOXES_PER_CYCLE = 300
                  boxes_this_cycle = boxes_needed[:MAX_BOXES_PER_CYCLE]

                  if boxes_this_cycle:
                      executor = ThreadPoolExecutor(
                          max_workers=min(12, len(boxes_this_cycle))
                      )

                      futures = {
                          executor.submit(
                              query_box_location_history,
                              caja
                          ): caja
                          for caja in boxes_this_cycle
                      }

                      try:
                          for future in as_completed(
                              futures,
                              timeout=50
                          ):
                              caja = futures[future]
                              try:
                                  caja, hist, error = future.result(timeout=1)
                              except Exception as e:
                                  hist = []
                                  error = str(e)[:300]

                              box_history[str(caja)] = {
                                  "history": hist,
                                  "error": error
                              }

                      except Exception as e:
                          print(
                              "AVISO: tanda de trazabilidad incompleta:",
                              str(e)
                          )

                      finally:
                          executor.shutdown(
                              wait=False,
                              cancel_futures=True
                          )

                  def norm_loc(v):
                      return str(v or "").strip().upper()

                  def latest_arrival(caja, ubicacion):
                      hist = box_history.get(
                          str(caja), {}
                      ).get("history", [])

                      candidates = [
                          m for m in hist
                          if norm_loc(
                              m.get("UbicacionFinal")
                          ) == norm_loc(ubicacion)
                      ]

                      if not candidates:
                          return None

                      return max(
                          candidates,
                          key=lambda m: parse_date(
                              m.get("fecha")
                          )
                      )

                  newly_detected = 0
                  still_pending = 0

                  for ubicacion, info in pending_locations.items():
                      # Si alguna caja de esta posición no entró todavía en
                      # la tanda, conservarla pendiente para el próximo ciclo.
                      if any(
                          caja not in box_history
                          for caja in info.get("boxes", [])
                      ):
                          old = previous_locations.get(ubicacion, {})
                          info["analysis"] = old.get(
                              "analysis",
                              {
                                  "status": "pending",
                                  "reason": "Pendiente de próxima tanda"
                              }
                          )
                          resolved_locations[ubicacion] = info
                          still_pending += 1
                          continue

                      arrivals = []

                      for caja in info.get("boxes", []):
                          event = latest_arrival(caja, ubicacion)
                          if not event:
                              continue

                          arrivals.append({
                              "caja": caja,
                              "skus": info.get(
                                  "box_skus", {}
                              ).get(caja, []),
                              "fecha": event.get("fecha", ""),
                              "UbicacionInicial": event.get(
                                  "UbicacionInicial", ""
                              ),
                              "UbicacionFinal": event.get(
                                  "UbicacionFinal", ""
                              ),
                              "Nombre_empleado": event.get(
                                  "Nombre_empleado", ""
                              ),
                              "Id_empleado": event.get(
                                  "Id_empleado", ""
                              ),
                              "Prioridad": event.get(
                                  "Prioridad", ""
                              )
                          })

                      arrivals.sort(
                          key=lambda a: parse_date(a.get("fecha"))
                      )

                      present_skus = set()
                      incident = None

                      for arrival in arrivals:
                          arriving = {
                              str(x).strip()
                              for x in arrival.get("skus", [])
                              if str(x).strip()
                          }

                          if not arriving:
                              continue

                          new_skus = arriving - present_skus

                          if (
                              incident is None
                              and present_skus
                              and new_skus
                              and len(present_skus | arriving) >= 2
                          ):
                              incident = {
                                  "responsable": arrival.get(
                                      "Nombre_empleado", ""
                                  ),
                                  "id_empleado": arrival.get(
                                      "Id_empleado", ""
                                  ),
                                  "fecha": arrival.get("fecha", ""),
                                  "caja_agregada": arrival.get(
                                      "caja", ""
                                  ),
                                  "sku_agregado": sorted(new_skus),
                                  "sku_que_ya_estaba": sorted(
                                      present_skus
                                  ),
                                  "origen": arrival.get(
                                      "UbicacionInicial", ""
                                  ),
                                  "destino": arrival.get(
                                      "UbicacionFinal", ""
                                  ),
                                  "prioridad": arrival.get(
                                      "Prioridad", ""
                                  )
                              }

                          present_skus.update(arriving)

                      if incident:
                          info["analysis"] = {
                              "status": "detected",
                              "responsable": incident,
                              "arrivals": arrivals
                          }
                          newly_detected += 1
                      else:
                          info["analysis"] = {
                              "status": "incomplete",
                              "reason": (
                                  "No se encontró un ingreso a la posición "
                                  "para todas las cajas actuales."
                              ),
                              "arrivals": arrivals
                          }
                          still_pending += 1

                      resolved_locations[ubicacion] = info

                  trace_payload = {
                      "updated_at": now_iso,
                      "source": (
                          "Copernico WMS · trazabilidad incremental "
                          "por posición mezclada"
                      ),
                      "criterion": (
                          "Solo se consultan posiciones mezcladas nuevas o "
                          "cuya composición cambió. Una posición ya resuelta "
                          "se reutiliza mientras mantenga las mismas cajas/SKU."
                      ),
                      "mixed_location_count": len(current_mixed),
                      "cached_detected_count": sum(
                          1
                          for x in resolved_locations.values()
                          if x.get("analysis", {}).get("status")
                          == "detected"
                      ),
                      "newly_detected_count": newly_detected,
                      "pending_count": still_pending,
                      "locations": resolved_locations
                  }

                  save_json_file(TRACE_FILE, trace_payload)

                  trace_size_mb = (
                      TRACE_FILE.stat().st_size / (1024 * 1024)
                  )

                  print(
                      "Detectadas nuevas:",
                      newly_detected,
                      "| detectadas totales/cache:",
                      trace_payload["cached_detected_count"],
                      "| pendientes:",
                      still_pending
                  )
                  print(
                      "trazabilidad-cajas.json generado correctamente ·",
                      f"{trace_size_mb:.2f} MB"
                  )

              except Exception as e:
                  print(
                      "AVISO: trazabilidad incremental no pudo actualizarse. "
                      "Se conservará el último válido:",
                      str(e)
                  )

              # Éxito general: reset backoff.
              status.update({
                  "status": "ok",
                  "fail_count": 0,
                  "next_retry_at": None,
                  "last_success_at": now_iso,
                  "last_attempt_at": now_iso,
                  "message": "Actualización correcta",
                  "http_code": 200,
                  "detail": "",
                  "copernico_user_id": user_id
              })

              save_json_file(
                  STATUS_FILE,
                  status
              )

          except SystemExit:
              raise

          except Exception as e:
              main_error = e

              # Error genérico: no pisa datos válidos; deja estado.
              fail_count = int(status.get("fail_count", 0)) + 1
              retry = now_utc() + timedelta(minutes=1)

              status.update({
                  "status": "error",
                  "fail_count": fail_count,
                  "next_retry_at": iso(retry),
                  "last_attempt_at": iso(now_utc()),
                  "message": "Error de actualización; se conserva último dato válido",
                  "detail": str(e)[:300]
              })

              save_json_file(
                  STATUS_FILE,
                  status
              )

          finally:
              if jwt and user_id is not None:
                  print("=== 5. LOGOUT ===")

                  try:
                      _, logout_status, _ = request_json(
                          LOGOUT_URL,
                          method="POST",
                          data={"id": user_id},
                          jwt=jwt,
                          timeout=30
                      )

                      print("LOGOUT HTTP:", logout_status)
                      print("LOGOUT OK")

                  except Exception as e:
                      logout_error = e
                      print("ERROR LOGOUT:", str(e))

          # Importante:
          # No hacemos fallar el workflow por indisponibilidad operativa.
          # Así sí se publica sync-status.json.
          if main_error:
              print("ERROR CONTROLADO:", str(main_error))

          if logout_error:
              print("AVISO LOGOUT:", str(logout_error))

          print("=== CICLO FINALIZADO ===")
          PY

      - name: Publicar estado y datos válidos
        run: |
          git config user.name "UBICACIONES AutoSync"
          git config user.email "actions@github.com"

          mkdir -p /tmp/ubicaciones-sync

          for f in stock.json pallets-proceso.json trazabilidad-cajas.json sync-status.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/ubicaciones-sync/$f"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          for f in stock.json pallets-proceso.json trazabilidad-cajas.json sync-status.json; do
            if [ -f "/tmp/ubicaciones-sync/$f" ]; then
              cp "/tmp/ubicaciones-sync/$f" "$f"
            fi
          done

          git add stock.json pallets-proceso.json trazabilidad-cajas.json sync-status.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "AutoSync Copérnico · datos y estado"
          git push origin HEAD:main
