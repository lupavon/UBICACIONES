name: Actualizar datos Copernico

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-copernico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar Copernico
        env:
          COPERNICO_EMAIL: ${{ secrets.COPERNICO_EMAIL }}
          COPERNICO_PASSWORD: ${{ secrets.COPERNICO_PASSWORD }}
        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          import urllib.parse
          import http.cookiejar
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          LOGIN_URL = "https://services.copernicowms.com/users/api/login"
          STOCK_URL = "https://services.copernicowms.com/backweb25/inventario/obtenerrefsxcaja?bodega=47"
          CAJA_API_BASE = "https://services.copernicowms.com/backweb25/caja/"
          LOGOUT_URL = "https://services.copernicowms.com/users/api/logout"

          EMAIL = os.environ["COPERNICO_EMAIL"]
          PASSWORD = os.environ["COPERNICO_PASSWORD"]

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar)
          )

          BASE_HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://copernicowms.com",
              "Referer": "https://copernicowms.com/",
              "User-Agent": "Mozilla/5.0"
          }

          def request_json(url, method="GET", data=None, jwt=None, timeout=120):
              headers = dict(BASE_HEADERS)

              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode("utf-8")
              else:
                  body = None

              if jwt:
                  headers["Authorization"] = jwt

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with opener.open(req, timeout=timeout) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as e:
                  try:
                      detail = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )[:500]
                  except Exception:
                      detail = ""

                  raise RuntimeError(
                      f"{method} {url} -> HTTP {e.code} {detail}"
                  )

              try:
                  parsed = json.loads(raw.decode("utf-8"))
              except Exception:
                  raise RuntimeError(
                      f"{method} {url} respondió HTTP {status}, "
                      "pero no devolvió JSON"
                  )

              return parsed, status, len(raw)

          def recursive_user_id(obj):
              preferred = {
                  "id",
                  "userid",
                  "user_id",
                  "idusuario",
                  "id_usuario",
                  "usuarioid",
                  "usuario_id"
              }

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      normalized = str(key).lower().replace("-", "_")

                      if normalized in preferred:
                          if isinstance(value, int):
                              return value

                          if isinstance(value, str) and value.isdigit():
                              return int(value)

                  for value in obj.values():
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              elif isinstance(obj, list):
                  for value in obj:
                      found = recursive_user_id(value)
                      if found is not None:
                          return found

              return None

          def user_id_from_jwt(token):
              try:
                  parts = token.split(".")

                  if len(parts) < 2:
                      return None

                  payload = parts[1]
                  payload += "=" * (-len(payload) % 4)

                  decoded = base64.urlsafe_b64decode(payload)
                  claims = json.loads(decoded.decode("utf-8"))

                  found = recursive_user_id(claims)
                  if found is not None:
                      return found

                  sub = claims.get("sub")

                  if isinstance(sub, int):
                      return sub

                  if isinstance(sub, str) and sub.isdigit():
                      return int(sub)

              except Exception:
                  pass

              return None

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "rows",
                  "data",
                  "items",
                  "result",
                  "results",
                  "stock",
                  "inventario"
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for subkey in (
                          "rows",
                          "data",
                          "items",
                          "results",
                          "stock"
                      ):
                          subvalue = value.get(subkey)
                          if isinstance(subvalue, list):
                              return subvalue

              return []

          def norm_key(value):
              return (
                  str(value)
                  .strip()
                  .lower()
                  .replace(" ", "")
                  .replace("_", "")
                  .replace("-", "")
              )

          def field(row, *names):
              if not isinstance(row, dict):
                  return ""

              indexed = {
                  norm_key(k): v
                  for k, v in row.items()
              }

              for name in names:
                  key = norm_key(name)
                  if key in indexed:
                      value = indexed[key]
                      if value is not None:
                          return value

              return ""

          def norm_value(value):
              return str(value or "").strip().upper()

          def parse_date(value):
              if value is None or value == "":
                  return float("-inf")

              if isinstance(value, (int, float)):
                  return float(value)

              text = str(value).strip()

              formats = (
                  "%d/%m/%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M",
                  "%Y-%m-%dT%H:%M:%S.%fZ",
                  "%Y-%m-%dT%H:%M:%SZ",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M"
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(text, fmt).timestamp()
                  except Exception:
                      pass

              try:
                  return datetime.fromisoformat(
                      text.replace("Z", "+00:00")
                  ).timestamp()
              except Exception:
                  return float("-inf")

          def caja_api(endpoint, caja, jwt, timeout=45):
              q = urllib.parse.quote(str(caja).strip(), safe="")
              url = CAJA_API_BASE + endpoint + "?caja=" + q
              payload, _, _ = request_json(
                  url,
                  method="GET",
                  jwt=jwt,
                  timeout=timeout
              )
              return payload

          def query_trace_full(caja, jwt):
              movimientos = caja_api("getmovimientos", caja, jwt)
              ubicaciones = caja_api("getubicaciones", caja, jwt)
              inventario = caja_api("getinventario", caja, jwt)

              return {
                  "ok": True,
                  "caja": str(caja).strip(),
                  "movimientos": movimientos,
                  "ubicaciones": ubicaciones,
                  "inventario": inventario
              }

          def query_ubicaciones(caja, jwt):
              payload = caja_api(
                  "getubicaciones",
                  caja,
                  jwt
              )
              return extract_rows(payload)

          def latest_move_to_process(moves):
              candidates = []

              for move in moves:
                  destino = field(
                      move,
                      "UbicacionFinal",
                      "ubicacion_final",
                      "ubicacionfinal"
                  )

                  if norm_value(destino) == "EN_PROCESO":
                      candidates.append(move)

              if not candidates:
                  return None

              return max(
                  candidates,
                  key=lambda x: parse_date(
                      field(
                          x,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                  )
              )

          def build_process_row(stock_row, trace_move=None, trace_error=""):
              return {
                  "Caja": field(
                      stock_row,
                      "Caja",
                      "caja",
                      "numeroCaja",
                      "NroCaja"
                  ),
                  "EAN": field(
                      stock_row,
                      "EAN",
                      "ean"
                  ),
                  "Referencia": field(
                      stock_row,
                      "referencia",
                      "Referencia",
                      "ref"
                  ),
                  "Descripcion": field(
                      stock_row,
                      "Descripcion",
                      "descripcion",
                      "Descripción"
                  ),
                  "Saldo": field(
                      stock_row,
                      "Saldo",
                      "saldo",
                      "Cantidad",
                      "cantidad"
                  ),
                  "Unidad": field(
                      stock_row,
                      "UnidadMedida",
                      "unidadMedida",
                      "Unidad"
                  ),
                  "FV": field(
                      stock_row,
                      "FV",
                      "fv",
                      "FechaVencimiento"
                  ),
                  "Ubicacion": (
                      field(
                          stock_row,
                          "Ubicacion",
                          "ubicacion"
                      )
                      or "EN_PROCESO"
                  ),
                  "PosicionOrigen": (
                      field(
                          trace_move,
                          "UbicacionInicial",
                          "ubicacion_inicial",
                          "ubicacionInicial"
                      )
                      if trace_move else ""
                  ),
                  "Maquinista": (
                      field(
                          trace_move,
                          "Nombre_empleado",
                          "NombreEmpleado",
                          "nombreEmpleado",
                          "Empleado"
                      )
                      if trace_move else ""
                  ),
                  "Id_maquinista": (
                      field(
                          trace_move,
                          "Id_empleado",
                          "IdEmpleado",
                          "idEmpleado"
                      )
                      if trace_move else ""
                  ),
                  "FechaIngresoProceso": (
                      field(
                          trace_move,
                          "fecha",
                          "Fecha",
                          "FechaMovimiento",
                          "fecha_movimiento"
                      )
                      if trace_move else ""
                  ),
                  "Prioridad": (
                      field(
                          trace_move,
                          "Prioridad",
                          "prioridad"
                      )
                      if trace_move else ""
                  ),
                  "Trazabilidad": (
                      "OK"
                      if trace_move
                      else (
                          trace_error
                          or "Sin movimiento a EN_PROCESO identificado"
                      )
                  )
              }

          jwt = None
          user_id = None
          main_error = None
          logout_error = None

          try:
              print("=== 1. LOGIN ===")

              login, _, _ = request_json(
                  LOGIN_URL,
                  method="POST",
                  data={
                      "email": EMAIL,
                      "password": PASSWORD,
                      "plataforma": "Copernico WMS"
                  },
                  timeout=30
              )

              jwt = login.get("jwt")

              if not jwt:
                  raise RuntimeError(
                      "Login respondió correctamente pero no devolvió jwt"
                  )

              user_id = recursive_user_id(login)

              if user_id is None:
                  user_id = user_id_from_jwt(jwt)

              if user_id is None:
                  raise RuntimeError(
                      "No pude obtener el ID del usuario "
                      "para realizar el logout"
                  )

              print("LOGIN OK")
              print("ID de sesión identificado correctamente")

              print("=== 2. STOCK BODEGA 47 ===")

              stock_response, status, size = request_json(
                  STOCK_URL,
                  method="GET",
                  jwt=jwt,
                  timeout=180
              )

              rows = extract_rows(stock_response)

              if not rows:
                  raise RuntimeError(
                      "Copernico respondió, pero no encontré filas de inventario"
                  )

              if len(rows) < 100:
                  raise RuntimeError(
                      f"Respuesta sospechosa: solamente {len(rows)} registros"
                  )

              print("STOCK HTTP:", status)
              print("Registros:", len(rows))
              print("Bytes recibidos:", size)

              now_iso = datetime.now(timezone.utc).isoformat()

              stock_payload = {
                  "updated_at": now_iso,
                  "source": "Copernico WMS · bodega 47 · GitHub Actions",
                  "row_count": len(rows),
                  "rows": rows
              }

              with open(
                  "stock.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      stock_payload,
                      f,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

              print("stock.json generado correctamente")

              print("=== 3. PALLETS EN PROCESO ===")

              process_stock_rows = [
                  row
                  for row in rows
                  if norm_value(
                      field(
                          row,
                          "Ubicacion",
                          "ubicacion",
                          "Location"
                      )
                  ) == "EN_PROCESO"
              ]

              process_boxes = sorted({
                  str(
                      field(
                          row,
                          "Caja",
                          "caja",
                          "numeroCaja",
                          "NroCaja"
                      )
                  ).strip()
                  for row in process_stock_rows
                  if str(
                      field(
                          row,
                          "Caja",
                          "caja",
                          "numeroCaja",
                          "NroCaja"
                      )
                  ).strip()
              })

              print("Líneas EN_PROCESO:", len(process_stock_rows))
              print("Cajas/pallets EN_PROCESO:", len(process_boxes))

              trace_by_box = {}

              def trace_process_one(caja):
                  try:
                      moves = query_ubicaciones(caja, jwt)
                      event = latest_move_to_process(moves)
                      return caja, event, ""
                  except Exception as e:
                      return caja, None, str(e)[:300]

              if process_boxes:
                  with ThreadPoolExecutor(
                      max_workers=min(8, len(process_boxes))
                  ) as executor:

                      futures = [
                          executor.submit(
                              trace_process_one,
                              caja
                          )
                          for caja in process_boxes
                      ]

                      for future in as_completed(futures):
                          caja, event, error = future.result()
                          trace_by_box[caja] = {
                              "event": event,
                              "error": error
                          }

              process_rows = []

              for stock_row in process_stock_rows:
                  caja = str(
                      field(
                          stock_row,
                          "Caja",
                          "caja",
                          "numeroCaja",
                          "NroCaja"
                      )
                  ).strip()

                  trace = trace_by_box.get(caja, {})

                  process_rows.append(
                      build_process_row(
                          stock_row,
                          trace_move=trace.get("event"),
                          trace_error=trace.get("error", "")
                      )
                  )

              identified = sum(
                  1
                  for row in process_rows
                  if row["PosicionOrigen"] and row["Maquinista"]
              )

              pallets_payload = {
                  "updated_at": now_iso,
                  "source": (
                      "Copernico WMS · EN_PROCESO · "
                      "trazabilidad de ubicaciones"
                  ),
                  "total_lineas": len(process_rows),
                  "total_pallets": len(process_boxes),
                  "identificados": identified,
                  "rows": process_rows
              }

              with open(
                  "pallets-proceso.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      pallets_payload,
                      f,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

              print("pallets-proceso.json generado correctamente")
              print("Identificados:", identified, "/", len(process_rows))

              print("=== 4. TRAZABILIDAD DE MEZCLAS ===")

              # Agrupa inventario actual por ubicación.
              by_location = {}

              for row in rows:
                  ubicacion = str(
                      field(
                          row,
                          "Ubicacion",
                          "ubicacion"
                      )
                  ).strip()

                  if not ubicacion:
                      continue

                  saldo_raw = field(
                      row,
                      "Saldo",
                      "saldo"
                  )

                  try:
                      saldo = float(saldo_raw)
                  except Exception:
                      saldo = 0.0

                  if saldo <= 0:
                      continue

                  by_location.setdefault(
                      ubicacion,
                      []
                  ).append(row)

              mixed_locations = {}
              trace_boxes = set()

              for ubicacion, loc_rows in by_location.items():
                  skus = {
                      str(
                          field(
                              row,
                              "referencia",
                              "Referencia",
                              "EAN",
                              "ean"
                          )
                      ).strip()
                      for row in loc_rows
                      if str(
                          field(
                              row,
                              "referencia",
                              "Referencia",
                              "EAN",
                              "ean"
                          )
                      ).strip()
                  }

                  if len(skus) < 2:
                      continue

                  boxes = sorted({
                      str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                      for row in loc_rows
                      if str(
                          field(
                              row,
                              "Caja",
                              "caja",
                              "numeroCaja",
                              "NroCaja"
                          )
                      ).strip()
                  })

                  mixed_locations[ubicacion] = {
                      "sku_count": len(skus),
                      "boxes": boxes
                  }

                  trace_boxes.update(boxes)

              print("Ubicaciones mezcladas:", len(mixed_locations))
              print("Cajas a trazar por mezcla:", len(trace_boxes))

              trace_dataset_boxes = {}

              def trace_full_one(caja):
                  try:
                      return caja, query_trace_full(caja, jwt)
                  except Exception as e:
                      return caja, {
                          "ok": False,
                          "caja": str(caja),
                          "error": str(e)[:300],
                          "movimientos": [],
                          "ubicaciones": [],
                          "inventario": []
                      }

              trace_boxes_sorted = sorted(trace_boxes)

              if trace_boxes_sorted:
                  with ThreadPoolExecutor(
                      max_workers=min(6, len(trace_boxes_sorted))
                  ) as executor:

                      futures = [
                          executor.submit(
                              trace_full_one,
                              caja
                          )
                          for caja in trace_boxes_sorted
                      ]

                      for future in as_completed(futures):
                          caja, result = future.result()
                          trace_dataset_boxes[str(caja)] = result

              trace_payload = {
                  "updated_at": now_iso,
                  "source": (
                      "Copernico WMS · trazabilidad automática de "
                      "cajas en posiciones con mezcla"
                  ),
                  "mixed_location_count": len(mixed_locations),
                  "box_count": len(trace_dataset_boxes),
                  "locations": mixed_locations,
                  "boxes": trace_dataset_boxes
              }

              with open(
                  "trazabilidad-cajas.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      trace_payload,
                      f,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

              print("trazabilidad-cajas.json generado correctamente")

          except Exception as e:
              main_error = e

          finally:
              if jwt and user_id is not None:
                  print("=== 5. LOGOUT ===")

                  try:
                      _, logout_status, _ = request_json(
                          LOGOUT_URL,
                          method="POST",
                          data={"id": user_id},
                          jwt=jwt,
                          timeout=30
                      )

                      print("LOGOUT HTTP:", logout_status)
                      print("LOGOUT OK")

                  except Exception as e:
                      logout_error = e
                      print("ERROR LOGOUT:", str(e))

          if main_error:
              raise main_error

          if logout_error:
              raise RuntimeError(
                  "La consulta terminó pero el logout falló: "
                  + str(logout_error)
              )

          print("=== CICLO COMPLETO OK ===")
          PY

      - name: Publicar archivos
        run: |
          git config user.name "UBICACIONES AutoSync"
          git config user.email "actions@github.com"

          cp stock.json /tmp/stock-nuevo.json
          cp pallets-proceso.json /tmp/pallets-proceso-nuevo.json
          cp trazabilidad-cajas.json /tmp/trazabilidad-cajas-nuevo.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/stock-nuevo.json stock.json
          cp /tmp/pallets-proceso-nuevo.json pallets-proceso.json
          cp /tmp/trazabilidad-cajas-nuevo.json trazabilidad-cajas.json

          git add stock.json pallets-proceso.json trazabilidad-cajas.json

          if git diff --cached --quiet; then
            echo "Los archivos remotos ya están actualizados."
            exit 0
          fi

          git commit -m "AutoSync stock, pallets en proceso y trazabilidad"
          git push origin HEAD:main
